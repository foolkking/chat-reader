name: Reading performance comparison

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://chat_reader:chat_reader_ci@127.0.0.1:5432/chat_reader
      ATTACHMENT_CURSOR_SECRET: synthetic-ci-attachment-cursor-secret-at-least-32-characters
      API_INTERNAL_URL: http://127.0.0.1:8000
      PUBLIC_WEB_BASE_URL: http://127.0.0.1:3107
      CORS_ORIGINS: http://127.0.0.1:3107
      PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
      E2E_READER_CAPACITY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.13.1"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install identical locked harness dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install -e apps/api
          pnpm --filter web exec playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/reading-comparison"
          cp apps/web/e2e/reader-capacity.spec.ts "$RUNNER_TEMP/reading-comparison/harness.ts"
      - name: Baseline then candidate on the same isolated runner
        timeout-minutes: 105
        shell: bash
        run: |
          set -euo pipefail
          candidate="${{ github.sha }}"
          baseline=43a714f2c13f6e6573eb02916c8ff8f78dd2d82e
          cleanup() {
            for file in "$RUNNER_TEMP/perf-api.pid" "$RUNNER_TEMP/perf-worker.pid"; do
              if [ -f "$file" ]; then
                pid="$(cat "$file")"
                kill "$pid" 2>/dev/null || true
                for attempt in $(seq 1 30); do
                  if ! kill -0 "$pid" 2>/dev/null; then break; fi
                  sleep 1
                done
                if kill -0 "$pid" 2>/dev/null; then return 1; fi
                rm "$file"
              fi
            done
            bash scripts/ci/postgres-service.sh stop
          }
          trap 'cleanup || true' EXIT
          candidate_failed=0
          for phase in baseline candidate; do
            ref="$baseline"; if [ "$phase" = candidate ]; then ref="$candidate"; fi
            git checkout --detach "$ref"
            # Apply only the identical measurement harness, never candidate app code.
            cp "$RUNNER_TEMP/reading-comparison/harness.ts" apps/web/e2e/reader-capacity.spec.ts
            export IMPORT_STORAGE_DIR="$RUNNER_TEMP/perf-$phase/imports"
            export EXPORT_STORAGE_DIR="$RUNNER_TEMP/perf-$phase/exports"
            export OFFLINE_STORAGE_DIR="$RUNNER_TEMP/perf-$phase/offline"
            export ASSET_STORAGE_DIR="$RUNNER_TEMP/perf-$phase/assets"
            export PLAYWRIGHT_GATE_ID="reader-capacity-$phase"
            mkdir -p "$IMPORT_STORAGE_DIR" "$EXPORT_STORAGE_DIR" "$OFFLINE_STORAGE_DIR" "$ASSET_STORAGE_DIR"
            bash scripts/ci/postgres-service.sh start
            (cd apps/api && python -m alembic upgrade head)
            (cd apps/api && pytest -q -s tests/test_offline_catalog_query_budget.py) | tee "$RUNNER_TEMP/reading-comparison/$phase-catalog.txt"
            pnpm --filter web build
            pushd apps/api
            nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > "$RUNNER_TEMP/perf-$phase-api.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/perf-api.pid"
            nohup python -m app.workers.import_worker > "$RUNNER_TEMP/perf-$phase-worker.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/perf-worker.pid"
            popd
            ready=0
            for attempt in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then ready=1; break; fi
              sleep 1
            done
            test "$ready" = 1
            printf 'phase=%s\nsource=%s\nrunner=%s\n' "$phase" "$ref" "$RUNNER_NAME" > "$RUNNER_TEMP/reading-comparison/$phase-source.txt"
            # Preserve both results with unchanged assertions and thresholds.
            # The immutable baseline is diagnostic; candidate results gate release.
            if pnpm --filter web exec playwright test --config=playwright.config.ts e2e/reader-capacity.spec.ts; then
              printf 'passed\n' > "$RUNNER_TEMP/reading-comparison/$phase-result.txt"
            else
              printf 'failed\n' > "$RUNNER_TEMP/reading-comparison/$phase-result.txt"
              if [ "$phase" = candidate ]; then candidate_failed=1; fi
            fi
            cp -a "apps/web/test-results/reader-capacity-$phase" "$RUNNER_TEMP/reading-comparison/$phase"
            cleanup
            # The copied harness is a tracked file on both revisions.
            git restore -- apps/web/e2e/reader-capacity.spec.ts
          done
          exit "$candidate_failed"
      - name: Preserve comparison measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reading-performance-comparison
          path: |
            ${{ runner.temp }}/reading-comparison
            apps/web/test-results/reader-capacity-*
          if-no-files-found: error
