name: Build release images
run-name: ${{ inputs.release_request != '' && format('Release qualification {0}', inputs.release_request) || 'Build release images' }}

on:
  workflow_dispatch:
    inputs:
      quality_source_run_id:
        description: 'One-off image-only repair: 43578495558; empty runs every quality job'
        required: false
        default: ''
        type: string
      release_request:
        description: 'Non-secret correlation ID from the protected release tag workflow (never skips checks)'
        required: false
        type: string
      distribution:
        description: 'Full qualification only: exact OWNER/REPO:numeric-id for an opted-in fork'
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  APP_ENV: test
  DATABASE_URL: postgresql+psycopg://chat_reader:chat_reader_ci@127.0.0.1:5432/chat_reader
  ATTACHMENT_CURSOR_SECRET: synthetic-ci-attachment-cursor-secret-at-least-32-characters
  API_INTERNAL_URL: http://127.0.0.1:8000
  PUBLIC_WEB_BASE_URL: http://127.0.0.1:3107
  CORS_ORIGINS: http://127.0.0.1:3107
  IMPORT_STORAGE_DIR: /tmp/chat-reader/imports
  EXPORT_STORAGE_DIR: /tmp/chat-reader/exports
  OFFLINE_STORAGE_DIR: /tmp/chat-reader/offline
  ASSET_STORAGE_DIR: /tmp/chat-reader/assets
  POSTGRES_EXPORT_INTEGRATION: "1"

jobs:
  api-quality-shard-1:
    if: ${{ inputs.quality_source_run_id == '' }}
    uses: ./.github/workflows/api-quality-shard.yml
    with:
      shard: 1

  api-quality-shard-2:
    if: ${{ inputs.quality_source_run_id == '' }}
    uses: ./.github/workflows/api-quality-shard.yml
    with:
      shard: 2

  api-quality-shard-3:
    if: ${{ inputs.quality_source_run_id == '' }}
    uses: ./.github/workflows/api-quality-shard.yml
    with:
      shard: 3

  api-quality-shard-4:
    if: ${{ inputs.quality_source_run_id == '' }}
    uses: ./.github/workflows/api-quality-shard.yml
    with:
      shard: 4

  api-quality:
    if: ${{ !cancelled() && inputs.quality_source_run_id == '' && needs.api-quality-shard-1.result == 'success' && needs.api-quality-shard-2.result == 'success' && needs.api-quality-shard-3.result == 'success' && needs.api-quality-shard-4.result == 'success' }}
    needs: [api-quality-shard-1, api-quality-shard-2, api-quality-shard-3, api-quality-shard-4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Download exact api shard 1 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: api-quality-shard-1-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api-shards/shard-1

      - name: Download exact api shard 2 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: api-quality-shard-2-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api-shards/shard-2

      - name: Download exact api shard 3 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: api-quality-shard-3-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api-shards/shard-3

      - name: Download exact api shard 4 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: api-quality-shard-4-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api-shards/shard-4

      - name: Require full original collection and native per-case execution
        run: >-
          python scripts/ci/api_shard_evidence.py "$RUNNER_TEMP/api-shards"
          "$RUNNER_TEMP/api-coverage.json" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - name: Upload non-deployable API quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-quality-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/api-coverage.json
            ${{ runner.temp }}/api-shards
          if-no-files-found: error
          retention-days: 14

  web-quality-shard-1:
    if: ${{ inputs.quality_source_run_id == '' }}
    uses: ./.github/workflows/web-quality.yml
    with:
      shard: 1

  web-quality-shard-2:
    if: ${{ inputs.quality_source_run_id == '' }}
    uses: ./.github/workflows/web-quality.yml
    with:
      shard: 2

  web-quality-shard-3:
    if: ${{ inputs.quality_source_run_id == '' }}
    uses: ./.github/workflows/web-quality.yml
    with:
      shard: 3

  web-quality:
    if: ${{ !cancelled() && inputs.quality_source_run_id == '' && needs.web-quality-shard-1.result == 'success' && needs.web-quality-shard-2.result == 'success' && needs.web-quality-shard-3.result == 'success' }}
    needs: [web-quality-shard-1, web-quality-shard-2, web-quality-shard-3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.1"
      - name: Download exact web shard 1 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-quality-shard-1-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-shards/shard-1

      - name: Download exact web shard 2 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-quality-shard-2-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-shards/shard-2

      - name: Download exact web shard 3 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-quality-shard-3-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-shards/shard-3

      - name: Require the complete original Web gate union
        run: >-
          node scripts/ci/quality-shard-evidence.mjs merge-web
          "$RUNNER_TEMP/web-shards"
          apps/web/test-results/release-gate-summary.json "$GITHUB_SHA"
      - name: Upload non-deployable quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-a-quality-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/web/test-results/release-gate-summary.json
            ${{ runner.temp }}/web-shards
          if-no-files-found: error
          retention-days: 14

  settings-quality-shard-1:
    if: ${{ inputs.quality_source_run_id == '' }}
    uses: ./.github/workflows/settings-browser-shard.yml
    with:
      shard: 1

  settings-quality-shard-2:
    if: ${{ inputs.quality_source_run_id == '' }}
    uses: ./.github/workflows/settings-browser-shard.yml
    with:
      shard: 2

  settings-quality-shard-3:
    if: ${{ inputs.quality_source_run_id == '' }}
    uses: ./.github/workflows/settings-browser-shard.yml
    with:
      shard: 3

  settings-quality-shard-4:
    if: ${{ inputs.quality_source_run_id == '' }}
    uses: ./.github/workflows/settings-browser-shard.yml
    with:
      shard: 4

  settings-restore:
    if: ${{ inputs.quality_source_run_id == '' }}
    runs-on: ubuntu-latest
    # No custom CI job/step timeouts; the hosted runner's platform cap applies.
    # Serial tests, native case deadlines and worker/resource bounds stay.
    env:
      DATABASE_URL: postgresql+psycopg://chat_reader:chat_reader_ci@127.0.0.1:65438/chat_reader
      # Keep the disposable fixture on a port allowed by the guarded seeders.
      CI_POSTGRES_PORT: "65438"
      AUTH_ENABLED: "true"
      AUTH_SESSION_SECRET: synthetic-settings-ci-session-secret-0123456789
      AUTH_COOKIE_SECURE: "false"
      E2E_SETTINGS_MAILBOX: "1"
      IMPORT_COMMIT_INLINE: "true"
      E2E_AUTH_EMAIL: settings-ci@example.test
      E2E_AUTH_PASSWORD: synthetic-settings-ci-admin-passphrase
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "8320"
      SMTP_STARTTLS: "false"
      SMTP_FROM_ADDRESS: noreply@example.test
      PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
      PLAYWRIGHT_GATE_ID: settings-stages-1-4
      NEXT_PUBLIC_PWA_NEGATIVE_TESTS: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Record Settings completion timing mode
        shell: bash
        run: |
          printf 'mode=%s\njob_timeout_minutes=%s\nsource_sha=%s\nworkflow_run_id=%s\nworkflow_run_attempt=%s\nstarted_at=%s\n' \
            'platform-default' \
            'not-set' \
            '${{ github.sha }}' \
            '${{ github.run_id }}' \
            '${{ github.run_attempt }}' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            | tee "$RUNNER_TEMP/settings-completion-mode.txt"

      - name: Start pinned disposable PostgreSQL with official-source fallback
        id: postgres
        run: bash scripts/ci/postgres-service.sh start

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.1"
          cache: pnpm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-test.lock

      - name: Install and migrate disposable fixture
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install --require-hashes -r apps/api/requirements-test.lock -r apps/api/requirements-build.lock
          python -m pip install --no-deps --no-build-isolation -e "apps/api[test]"
          mkdir -p "$IMPORT_STORAGE_DIR" "$EXPORT_STORAGE_DIR" "$OFFLINE_STORAGE_DIR" "$ASSET_STORAGE_DIR"
          cd apps/api
          python -m alembic upgrade head

      - name: Build authenticated Web and install Chromium
        run: |
          /usr/bin/time -f 'phase=authenticated-web-build\nelapsed_seconds=%e\nmax_rss_kb=%M\nexit_code=%x' \
            -o "$RUNNER_TEMP/settings-build-timing.txt" pnpm --filter web build
          pnpm --filter web exec playwright install --with-deps chromium

      - name: System archive restore into a fresh PostgreSQL instance
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/settings-restore-report.json
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ runner.temp }}/settings-restore-blob
          PLAYWRIGHT_BLOB_OUTPUT_NAME: restore.zip
        run: |
          export E2E_SYSTEM_ARCHIVE_SOURCE="$RUNNER_TEMP/synthetic-system.cr"
          cd apps/api
          python tests/build_system_archive_browser_fixture.py
          python - <<'PY'
          import os
          from pathlib import Path
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["DATABASE_URL"], isolation_level="AUTOCOMMIT")
          with engine.connect() as db:
              db.execute(text('CREATE DATABASE "chat_reader_archive_restore"'))
          url = engine.url.set(database="chat_reader_archive_restore").render_as_string(hide_password=False)
          Path(os.environ["RUNNER_TEMP"], "archive-database-url").write_text(url)
          PY
          export DATABASE_URL="$(cat "$RUNNER_TEMP/archive-database-url")"
          export IMPORT_STORAGE_DIR="$RUNNER_TEMP/archive-restore/imports"
          export EXPORT_STORAGE_DIR="$RUNNER_TEMP/archive-restore/exports"
          export OFFLINE_STORAGE_DIR="$RUNNER_TEMP/archive-restore/offline"
          export ASSET_STORAGE_DIR="$RUNNER_TEMP/archive-restore/assets"
          mkdir -p "$IMPORT_STORAGE_DIR" "$EXPORT_STORAGE_DIR" "$OFFLINE_STORAGE_DIR" "$ASSET_STORAGE_DIR"
          python -m alembic upgrade head
          uvicorn settings_browser_fixture:app --app-dir tests --host 127.0.0.1 --port 8000 --no-access-log > "$RUNNER_TEMP/archive-api.log" 2>&1 &
          archive_api_pid=$!
          python -m app.workers.import_worker > "$RUNNER_TEMP/archive-worker.log" 2>&1 &
          archive_worker_pid=$!
          printf 'phase=fresh-instance-restore\nfixture_start_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$RUNNER_TEMP/archive-fixture-lifecycle.txt"
          trap 'status=$?; printf "fixture_stop_at=%s\nstep_exit_code=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$status" >> "$RUNNER_TEMP/archive-fixture-lifecycle.txt" || true; kill "$archive_api_pid" "$archive_worker_pid" 2>/dev/null || true; exit "$status"' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          cd ../..
          PLAYWRIGHT_GATE_ID=system-archive-new-instance /usr/bin/time -f 'phase=fresh-instance-restore\nelapsed_seconds=%e\nmax_rss_kb=%M\nexit_code=%x' \
            -o "$RUNNER_TEMP/settings-restore-timing.txt" \
            pnpm --filter web exec playwright test --config=playwright.config.ts e2e/system-archive-new-instance.spec.ts
          PLAYWRIGHT_EXPECTED_GATES=system-archive-new-instance node apps/web/e2e/gate-summary.mjs apps/web/test-results apps/web/test-results/settings-gate-summary.json

      - name: Bind native fresh restore execution
        run: >-
          node scripts/ci/quality-shard-evidence.mjs record-restore
          "$RUNNER_TEMP/settings-restore-report.json" "$RUNNER_TEMP/settings-restore-blob/restore.zip"
          "$RUNNER_TEMP/settings-restore-binding.json"

      - name: Upload settings quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: settings-restore-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/web/test-results
            ${{ runner.temp }}/settings-restore-report.json
            ${{ runner.temp }}/settings-restore-binding.json
            ${{ runner.temp }}/settings-restore-blob
            ${{ runner.temp }}/settings-shards
            ${{ runner.temp }}/settings-merged-blobs
            ${{ runner.temp }}/settings-full-collection.json
            ${{ runner.temp }}/settings-merged-report.json
            ${{ runner.temp }}/settings-completion-mode.txt
            ${{ runner.temp }}/settings-build-timing.txt
            ${{ runner.temp }}/settings-matrix-timing.txt
            ${{ runner.temp }}/settings-restore-timing.txt
            ${{ runner.temp }}/settings-fixture-lifecycle.txt
            ${{ runner.temp }}/archive-fixture-lifecycle.txt
            ${{ runner.temp }}/settings-api.log
            ${{ runner.temp }}/settings-worker.log
            ${{ runner.temp }}/archive-api.log
            ${{ runner.temp }}/archive-worker.log
          retention-days: 14

      - name: Stop owned disposable PostgreSQL
        if: ${{ always() && steps.postgres.outcome == 'success' }}
        run: bash scripts/ci/postgres-service.sh stop

  settings-quality:
    if: ${{ !cancelled() && inputs.quality_source_run_id == '' && needs.settings-quality-shard-1.result == 'success' && needs.settings-quality-shard-2.result == 'success' && needs.settings-quality-shard-3.result == 'success' && needs.settings-quality-shard-4.result == 'success' && needs.settings-restore.result == 'success' }}
    needs: [settings-quality-shard-1, settings-quality-shard-2, settings-quality-shard-3, settings-quality-shard-4, settings-restore]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://chat_reader:chat_reader_ci@127.0.0.1:65438/chat_reader
      # Keep the disposable fixture on a port allowed by the guarded seeders.
      CI_POSTGRES_PORT: "65438"
      AUTH_ENABLED: "true"
      AUTH_SESSION_SECRET: synthetic-settings-ci-session-secret-0123456789
      AUTH_COOKIE_SECURE: "false"
      E2E_SETTINGS_MAILBOX: "1"
      IMPORT_COMMIT_INLINE: "true"
      E2E_AUTH_EMAIL: settings-ci@example.test
      E2E_AUTH_PASSWORD: synthetic-settings-ci-admin-passphrase
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "8320"
      SMTP_STARTTLS: "false"
      SMTP_FROM_ADDRESS: noreply@example.test
      PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
      PLAYWRIGHT_GATE_ID: settings-stages-1-4
      NEXT_PUBLIC_PWA_NEGATIVE_TESTS: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Record Settings completion timing mode
        shell: bash
        run: |
          printf 'mode=%s\njob_timeout_minutes=%s\nsource_sha=%s\nworkflow_run_id=%s\nworkflow_run_attempt=%s\nstarted_at=%s\n' \
            'platform-default' \
            'not-set' \
            '${{ github.sha }}' \
            '${{ github.run_id }}' \
            '${{ github.run_attempt }}' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            | tee "$RUNNER_TEMP/settings-completion-mode.txt"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.1"
          cache: pnpm
      - name: Install report tooling only
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download exact settings shard 1 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: settings-quality-shard-1-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/settings-shards/shard-1

      - name: Download exact settings shard 2 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: settings-quality-shard-2-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/settings-shards/shard-2

      - name: Download exact settings shard 3 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: settings-quality-shard-3-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/settings-shards/shard-3

      - name: Download exact settings shard 4 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: settings-quality-shard-4-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/settings-shards/shard-4

      - name: Download exact independent fresh restore evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: settings-restore-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/settings-restore

      - name: Collect original Settings selection and merge genuine Playwright blobs
        env:
          E2E_CONTEXT_ADMIN: "1"
        run: |
          PLAYWRIGHT_JSON_OUTPUT_NAME="$RUNNER_TEMP/settings-full-collection.json" \
            pnpm --filter web exec playwright test --config=playwright.config.ts 'e2e/settings-.*\.spec\.ts' e2e/context-admin-bundles.spec.ts --list --reporter=json
          node scripts/ci/quality-shard-evidence.mjs prepare-settings-blobs \
            "$RUNNER_TEMP/settings-shards" "$RUNNER_TEMP/settings-merged-blobs"
          PLAYWRIGHT_JSON_OUTPUT_NAME="$RUNNER_TEMP/settings-merged-report.json" \
            pnpm --filter web exec playwright merge-reports --reporter=json "$RUNNER_TEMP/settings-merged-blobs"
          node scripts/ci/quality-shard-evidence.mjs merge-settings \
            "$RUNNER_TEMP/settings-shards" "$RUNNER_TEMP/settings-full-collection.json" \
            "$RUNNER_TEMP/settings-merged-report.json" apps/web/test-results "$GITHUB_SHA"

      - name: Verify independent restore and complete Settings summary
        run: |
          node scripts/ci/quality-shard-evidence.mjs verify-restore "$RUNNER_TEMP/settings-restore" apps/web/test-results "$GITHUB_SHA"
          PLAYWRIGHT_EXPECTED_GATES=settings-stages-1-4,system-archive-new-instance node apps/web/e2e/gate-summary.mjs apps/web/test-results apps/web/test-results/settings-gate-summary.json

      - name: Upload settings quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: settings-quality-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/web/test-results
            ${{ runner.temp }}/settings-restore
            ${{ runner.temp }}/settings-shards
            ${{ runner.temp }}/settings-merged-blobs
            ${{ runner.temp }}/settings-full-collection.json
            ${{ runner.temp }}/settings-merged-report.json
            ${{ runner.temp }}/settings-completion-mode.txt
            ${{ runner.temp }}/settings-build-timing.txt
            ${{ runner.temp }}/settings-matrix-timing.txt
            ${{ runner.temp }}/settings-restore-timing.txt
            ${{ runner.temp }}/settings-fixture-lifecycle.txt
            ${{ runner.temp }}/archive-fixture-lifecycle.txt
            ${{ runner.temp }}/settings-api.log
            ${{ runner.temp }}/settings-worker.log
            ${{ runner.temp }}/archive-api.log
            ${{ runner.temp }}/archive-worker.log
          retention-days: 14

  reading-performance-comparison:
    if: ${{ inputs.quality_source_run_id == '' }}
    uses: ./.github/workflows/reading-performance.yml

  image-preparation:
    if: ${{ inputs.quality_source_run_id == '' }}
    runs-on: ubuntu-latest
    env:
      PYTHON_BASE_IMAGE: public.ecr.aws/docker/library/python:3.11-slim@sha256:e88e9763f943ec1834f992a4b51e0f24500486803e8bc534e5767af9ea65f6ce
      NODE_BASE_IMAGE: public.ecr.aws/docker/library/node:22.13.1-alpine@sha256:e2b39f7b64281324929257d0f8004fb6cb4bf0fdfb9aa8cedb235a766aec31da
    outputs:
      artifact_id: ${{ steps.candidate_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.candidate_artifact.outputs.artifact-digest }}
      producer_attempt: ${{ steps.provenance.outputs.attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 3

      - name: Require clean exact-source preparation
        run: python3 scripts/ci/image_candidate.py preflight

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker

      - name: Prepare pinned image bases with official-source fallback
        run: bash scripts/ci/image-base-sources.sh

      - name: Record image build metadata
        run: echo "IMAGE_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Record artifact producer attempt
        id: provenance
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Build API and worker image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg PYTHON_BASE_IMAGE="${PYTHON_BASE_IMAGE}" \
            --build-arg BUILD_REVISION="${GITHUB_SHA}" \
            --label org.opencontainers.image.created="${IMAGE_BUILD_TIME}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag chat-reader-api:${GITHUB_SHA} apps/api
          docker tag chat-reader-api:${GITHUB_SHA} chat-reader-import-worker:${GITHUB_SHA}
          docker tag chat-reader-api:${GITHUB_SHA} chat-reader-migrate:${GITHUB_SHA}

      - name: Start disposable PostgreSQL for the real memory gate
        id: small_zip_postgres
        run: bash scripts/ci/postgres-service.sh start

      - name: Verify real 320 MiB worker ZIP analysis and commit without swap
        run: python3 scripts/ci/small-import-memory-gate.py

      - name: Verify bounded ZIP 100 and 500 MiB sources and long Markdown
        run: python3 scripts/ci/bounded-import-memory-gate.py

      - name: Stop memory-gate PostgreSQL
        if: ${{ always() && steps.small_zip_postgres.outcome == 'success' }}
        run: bash scripts/ci/postgres-service.sh stop

      - name: Preserve real memory-gate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: small-zip-memory-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            small-zip-memory.json
            bounded-zip-*.json
          if-no-files-found: warn
          retention-days: 3

      - name: Verify real ORM memory-control-plane status and source guards
        run: >-
          docker run --rm --env APP_ENV=test --env TEMP=/data
          chat-reader-api:${GITHUB_SHA}
          python -m unittest scripts.test_verify_small_zip_memory -v

      - name: Build Web image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg NODE_BASE_IMAGE="${NODE_BASE_IMAGE}" \
            --file apps/web/Dockerfile \
            --build-arg API_INTERNAL_URL=http://api:8000 \
            --build-arg BUILD_REVISION="${GITHUB_SHA}" \
            --build-arg COMPLEX_ATTACHMENT_PREVIEW_ENABLED=false \
            --build-arg WEB_BUILD_HEAP_MB=2048 \
            --label org.opencontainers.image.created="${IMAGE_BUILD_TIME}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag chat-reader-web:${GITHUB_SHA} \
            .

      - name: Inspect release images
        run: bash scripts/inspect-release-images.sh "${GITHUB_SHA}"

      - name: Package non-deployable exact tested candidate
        run: |
          set -euo pipefail
          docker save \
            chat-reader-api:${GITHUB_SHA} \
            chat-reader-import-worker:${GITHUB_SHA} \
            chat-reader-migrate:${GITHUB_SHA} \
            chat-reader-web:${GITHUB_SHA} \
            | gzip -1 > chat-reader-images.tar.gz
          python3 scripts/ci/image_candidate.py prepare
          test ! -e release-manifest.json

      - name: Upload non-deployable image candidate only
        id: candidate_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: non-deployable-image-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            chat-reader-images.tar.gz
            image-candidate.json
            image-inspection.json
            small-zip-memory.json
            bounded-zip-memory.json
            deploy/nginx-internal-diagnostics.location.conf
          if-no-files-found: error
          retention-days: 3

  build-images:
    needs: [api-quality, web-quality, settings-quality, reading-performance-comparison, image-preparation]
    if: ${{ !cancelled() && ((inputs.quality_source_run_id == '' && needs.api-quality.result == 'success' && needs.web-quality.result == 'success' && needs.settings-quality.result == 'success' && needs.reading-performance-comparison.result == 'success' && needs.image-preparation.result == 'success') || (inputs.quality_source_run_id != '' && needs.api-quality.result == 'skipped' && needs.web-quality.result == 'skipped' && needs.settings-quality.result == 'skipped' && needs.reading-performance-comparison.result == 'skipped' && needs.image-preparation.result == 'skipped')) }}
    runs-on: ubuntu-latest
    # Same Docker Official Image indexes as Hub; independently verified before pinning.
    # See docs/execution/CI_REGISTRY_SOURCE_2026-10-10.md for provenance/update rules.
    env:
      PYTHON_BASE_IMAGE: public.ecr.aws/docker/library/python:3.11-slim@sha256:e88e9763f943ec1834f992a4b51e0f24500486803e8bc534e5767af9ea65f6ce
      NODE_BASE_IMAGE: public.ecr.aws/docker/library/node:22.13.1-alpine@sha256:e2b39f7b64281324929257d0f8004fb6cb4bf0fdfb9aa8cedb235a766aec31da
    outputs:
      artifact_id: ${{ steps.release_artifact.outputs.artifact-id }}
      producer_attempt: ${{ steps.provenance.outputs.attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 3

      - name: Image-only release policy negative controls
        if: ${{ inputs.quality_source_run_id != '' }}
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_image_only_quality_reuse.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_image_only_selector_lineage.py' -v
          node --test scripts/ci/*.test.mjs

      - name: Record verified release quality provenance
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_JOB_RESULTS: ${{ toJSON(needs) }}
          QUALITY_SOURCE_RUN_ID: ${{ inputs.quality_source_run_id }}
        run: >-
          python3 scripts/ci/image-only-quality-reuse.py
          --source-run "$QUALITY_SOURCE_RUN_ID"
          --head "$GITHUB_SHA"
          --output "$RUNNER_TEMP/quality-verification.json"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: ${{ inputs.quality_source_run_id != '' }}
        with:
          driver: docker

      - name: Prepare pinned image bases with official-source fallback
        if: ${{ inputs.quality_source_run_id != '' }}
        run: bash scripts/ci/image-base-sources.sh

      - name: Record image build metadata
        if: ${{ inputs.quality_source_run_id != '' }}
        run: echo "IMAGE_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Record artifact producer attempt
        id: provenance
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Build API and worker image
        if: ${{ inputs.quality_source_run_id != '' }}
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg PYTHON_BASE_IMAGE="${PYTHON_BASE_IMAGE}" \
            --build-arg BUILD_REVISION="${GITHUB_SHA}" \
            --label org.opencontainers.image.created="${IMAGE_BUILD_TIME}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag chat-reader-api:${GITHUB_SHA} apps/api
          docker tag chat-reader-api:${GITHUB_SHA} chat-reader-import-worker:${GITHUB_SHA}
          docker tag chat-reader-api:${GITHUB_SHA} chat-reader-migrate:${GITHUB_SHA}

      - name: Start disposable PostgreSQL for the real memory gate
        if: ${{ inputs.quality_source_run_id != '' }}
        id: small_zip_postgres
        run: bash scripts/ci/postgres-service.sh start

      - name: Verify real 320 MiB worker ZIP analysis and commit without swap
        if: ${{ inputs.quality_source_run_id != '' }}
        run: python3 scripts/ci/small-import-memory-gate.py

      - name: Verify bounded ZIP 100 and 500 MiB sources and long Markdown
        if: ${{ inputs.quality_source_run_id != '' }}
        run: python3 scripts/ci/bounded-import-memory-gate.py

      - name: Stop memory-gate PostgreSQL
        if: ${{ inputs.quality_source_run_id != '' && (always() && steps.small_zip_postgres.outcome == 'success') }}
        run: bash scripts/ci/postgres-service.sh stop

      - name: Preserve real memory-gate evidence
        if: ${{ inputs.quality_source_run_id != '' && (always()) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: small-zip-memory-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            small-zip-memory.json
            bounded-zip-*.json
          if-no-files-found: warn
          retention-days: 3

      - name: Verify real ORM memory-control-plane status and source guards
        if: ${{ inputs.quality_source_run_id != '' }}
        run: >-
          docker run --rm --env APP_ENV=test --env TEMP=/data
          chat-reader-api:${GITHUB_SHA}
          python -m unittest scripts.test_verify_small_zip_memory -v

      - name: Build Web image
        if: ${{ inputs.quality_source_run_id != '' }}
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg NODE_BASE_IMAGE="${NODE_BASE_IMAGE}" \
            --file apps/web/Dockerfile \
            --build-arg API_INTERNAL_URL=http://api:8000 \
            --build-arg BUILD_REVISION="${GITHUB_SHA}" \
            --build-arg COMPLEX_ATTACHMENT_PREVIEW_ENABLED=false \
            --build-arg WEB_BUILD_HEAP_MB=2048 \
            --label org.opencontainers.image.created="${IMAGE_BUILD_TIME}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag chat-reader-web:${GITHUB_SHA} \
            .

      - name: Inspect release images
        if: ${{ inputs.quality_source_run_id != '' }}
        run: bash scripts/inspect-release-images.sh "${GITHUB_SHA}"

      - name: Package images and provenance
        if: ${{ inputs.quality_source_run_id != '' }}
        run: |
          cp "$RUNNER_TEMP/quality-verification.json" quality-verification.json
          docker save \
            chat-reader-api:${GITHUB_SHA} \
            chat-reader-import-worker:${GITHUB_SHA} \
            chat-reader-migrate:${GITHUB_SHA} \
            chat-reader-web:${GITHUB_SHA} \
            | gzip -1 > chat-reader-images.tar.gz
          jq -n \
            --slurpfile quality quality-verification.json \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg built_at "$IMAGE_BUILD_TIME" \
            --arg archive "chat-reader-images.tar.gz" \
            --arg api_image_id "$(docker image inspect -f '{{.Id}}' chat-reader-api:${GITHUB_SHA})" \
            --arg web_image_id "$(docker image inspect -f '{{.Id}}' chat-reader-web:${GITHUB_SHA})" \
            '{schema_version: 2, commit: $commit, workflow_run_id: $run_id, workflow_run_attempt: $run_attempt, built_at: $built_at, archive: $archive, images: {api: $api_image_id, web: $web_image_id}, quality_verification: $quality[0], diagnostics_gateway: {path: "deploy/nginx-internal-diagnostics.location.conf"}}' \
            > release-manifest.json

      - name: Promote exact prepared candidate after every quality gate
        if: ${{ inputs.quality_source_run_id == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.image-preparation.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.image-preparation.outputs.artifact_digest }}
          CANDIDATE_ATTEMPT: ${{ needs.image-preparation.outputs.producer_attempt }}
        run: |
          test "$CANDIDATE_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
          python3 scripts/ci/image_candidate.py promote \
            --root "$RUNNER_TEMP/exact-image-candidate" \
            --quality "$RUNNER_TEMP/quality-verification.json" \
            --artifact-id "$CANDIDATE_ARTIFACT_ID" --artifact-digest "$CANDIDATE_ARTIFACT_DIGEST"

      - name: Upload deployable release artifact
        id: release_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chat-reader-images-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            chat-reader-images.tar.gz
            image-candidate.json
            release-manifest.json
            quality-verification.json
            image-inspection.json
            small-zip-memory.json
            bounded-zip-memory.json
            deploy/nginx-internal-diagnostics.location.conf
          if-no-files-found: error
          retention-days: 3

  inspect-release-artifact:
    needs: build-images
    if: ${{ needs.build-images.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_ARTIFACT_ID: ${{ needs.build-images.outputs.artifact_id }}
      ARTIFACT_PRODUCER_ATTEMPT: ${{ needs.build-images.outputs.producer_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 3

      - name: Require the successful producer's artifact reference
        run: |
          case "$RELEASE_ARTIFACT_ID" in ''|*[!0-9]*) exit 1 ;; esac
          test "$RELEASE_ARTIFACT_ID" -ge 1
          case "$ARTIFACT_PRODUCER_ATTEMPT" in ''|*[!0-9]*) exit 1 ;; esac
          test "$ARTIFACT_PRODUCER_ATTEMPT" -ge 1
          test "$ARTIFACT_PRODUCER_ATTEMPT" -le "$GITHUB_RUN_ATTEMPT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build-images.outputs.artifact_id }}
          merge-multiple: true
          path: release-artifact

      - name: Inspect downloaded release archive independently
        working-directory: release-artifact
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_SOURCE_RUN_ID: ${{ inputs.quality_source_run_id }}
        run: |
          set -euo pipefail
          test -s quality-verification.json
          python3 ../scripts/ci/image-only-quality-reuse.py \
            --source-run "$QUALITY_SOURCE_RUN_ID" --head "$GITHUB_SHA" \
            --producer-attempt "$ARTIFACT_PRODUCER_ATTEMPT" \
            --verify-report quality-verification.json --manifest release-manifest.json \
            --output "$RUNNER_TEMP/quality-verification-consumer.json"
          test -s chat-reader-images.tar.gz
          test -s release-manifest.json
          test -s image-inspection.json
          test -s small-zip-memory.json
          test -s bounded-zip-memory.json
          jq -e --arg sha "$GITHUB_SHA" \
            '.revision == $sha and .passed == true and .real_sensor == true and (.cases | length) == 4
              and ([.cases[].case] | sort) == ["assets100","assets500","long","small"]
              and all(.cases[]; .revision == $sha and .passed == true and .real_sensor == true
                and .draft_format == 2 and .workspace_peak_delta_bytes <= 67108864
                and .memory_swap_limit_bytes == .memory_limit_bytes
                and .memory_limit_bytes == (if .case == "assets500" then 671088640 else 335544320 end)
                and .oom == 0 and .oom_kill == 0 and .failcnt_delta == 0 and .restarts == 0
                and .conversation_count == 1 and .attachment_count == .verified_asset_hashes
                  and (if .case == "small" then .message_count == 4 and .attachment_count == 14 and .reference_count == 13
                       else .message_count == 36 and .block_count >= 6000 end)
                  and (if .case == "assets100" then .archive_bytes >= 102760448 and .archive_bytes <= 104857600 and .attachment_count == 4 and .reference_count == 4
                       elif .case == "assets500" then .archive_bytes >= 522190848 and .archive_bytes <= 524288000 and .attachment_count == 4 and .reference_count == 4
                       elif .case == "long" then .archive_bytes > 1048576 and .attachment_count == 0
                       else true end))' \
            bounded-zip-memory.json >/dev/null
          jq -e --arg sha "$GITHUB_SHA" \
            '.revision == $sha and .passed == true and .real_sensor == true
              and .memory_limit_bytes == 335544320 and .memory_swap_limit_bytes == 335544320
              and .workspace_peak_delta_bytes <= 67108864 and .oom == 0 and .oom_kill == 0 and .restarts == 0
              and .conversation_count == 1 and .message_count == 4
              and .attachment_count == 14 and .reference_count == 13 and .verified_asset_hashes == 14' \
            small-zip-memory.json >/dev/null
          jq -e --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$ARTIFACT_PRODUCER_ATTEMPT" \
            '.schema_version == 2 and .commit == $sha and .workflow_run_id == $run
              and .workflow_run_attempt == $attempt and .archive == "chat-reader-images.tar.gz"
              and (.images.api | test("^sha256:[a-f0-9]{64}$"))
              and (.images.web | test("^sha256:[a-f0-9]{64}$"))' release-manifest.json >/dev/null
          jq -e --arg sha "$GITHUB_SHA" \
            '.revision == $sha and .forbidden_paths_present == false and (.images | length == 4)' \
            image-inspection.json >/dev/null
          docker load --input chat-reader-images.tar.gz >"$RUNNER_TEMP/chat-reader-docker-load.txt"
          for image in api import-worker migrate web; do
            image_ref="chat-reader-${image}:${GITHUB_SHA}"
            revision="$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_ref")"
            test "$revision" = "$GITHUB_SHA"
            image_id="$(docker image inspect -f '{{.Id}}' "$image_ref")"
            case "$image" in web) role=web ;; *) role=api ;; esac
            test "$image_id" = "$(jq -r --arg role "$role" '.images[$role]' release-manifest.json)"
            test "$(docker image inspect -f '{{.Os}}/{{.Architecture}}' "$image_ref")" = "linux/amd64"
            jq -e --arg name "$image_ref" --arg id "$image_id" \
              '[.images[] | select(.name == $name and .id == $id)] | length == 1' \
              image-inspection.json >/dev/null
          done

      - name: Verify promoted candidate and resource identity independently
        if: ${{ inputs.quality_source_run_id == '' }}
        working-directory: release-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ../scripts/ci/image_candidate.py consume
