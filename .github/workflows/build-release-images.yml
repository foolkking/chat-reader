name: Build release images

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ENV: test
  DATABASE_URL: postgresql+psycopg://chat_reader:chat_reader_ci@127.0.0.1:5432/chat_reader
  ATTACHMENT_CURSOR_SECRET: synthetic-ci-attachment-cursor-secret-at-least-32-characters
  API_INTERNAL_URL: http://127.0.0.1:8000
  PUBLIC_WEB_BASE_URL: http://127.0.0.1:3107
  CORS_ORIGINS: http://127.0.0.1:3107
  IMPORT_STORAGE_DIR: /tmp/chat-reader/imports
  EXPORT_STORAGE_DIR: /tmp/chat-reader/exports
  OFFLINE_STORAGE_DIR: /tmp/chat-reader/offline
  ASSET_STORAGE_DIR: /tmp/chat-reader/assets
  POSTGRES_EXPORT_INTEGRATION: "1"

jobs:
  api-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chat_reader
          POSTGRES_USER: chat_reader
          POSTGRES_PASSWORD: chat_reader_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat_reader -d chat_reader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e apps/api
      - name: Prepare API test services
        run: |
          mkdir -p "$IMPORT_STORAGE_DIR" "$EXPORT_STORAGE_DIR" "$OFFLINE_STORAGE_DIR" "$ASSET_STORAGE_DIR"
          cd apps/api
          python -m alembic upgrade head
      - name: Context runtime and distributed Bundle consistency
        run: |
          python tools/context-skills/build.py --output apps/web/public/skills --check
          python -m pytest tools/context-skills/tests -q
      - name: Release C observability and cleanup safety suite
        run: >-
          cd apps/api && pytest -q
          tests/test_observability.py
          tests/test_diagnostics.py
          tests/test_worker_liveness.py
          tests/test_artifact_lifecycle.py
          tests/test_cleanup_execution.py
          tests/test_artifact_transaction_boundary.py
          tests/test_import_queue.py
      - name: API full suite
        env:
          SETTINGS_POSTGRES_INTEGRATION: "1"
          AUTH_SESSION_SECRET: synthetic-settings-postgres-ci-secret-0123456789
        run: cd apps/api && pytest
      - name: Alembic single-head and current validation
        run: |
          cd apps/api
          python scripts/verify_migration_state.py --require-current

  web-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chat_reader
          POSTGRES_USER: chat_reader
          POSTGRES_PASSWORD: chat_reader_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat_reader -d chat_reader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        id: pnpm-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Record pnpm cache evidence
        shell: bash
        run: |
          printf 'cache_hit=%s\ncache_key=%s\n' \
            '${{ steps.pnpm-cache.outputs.cache-hit }}' \
            '${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}' \
            > "$RUNNER_TEMP/pnpm-cache.txt"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install locked dependencies without lifecycle scripts
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install --upgrade pip
          python -m pip install -e apps/api

      - name: Prepare test services
        run: |
          mkdir -p "$IMPORT_STORAGE_DIR" "$EXPORT_STORAGE_DIR" "$OFFLINE_STORAGE_DIR" "$ASSET_STORAGE_DIR"
          cd apps/api
          python -m alembic upgrade head

      - name: Web lint
        run: pnpm --filter web lint

      - name: Web typecheck
        run: pnpm --filter web typecheck

      - name: Web production build (timed)
        run: >-
          /usr/bin/time -f 'build=standard
          elapsed_seconds=%e
          max_rss_kb=%M'
          -o "$RUNNER_TEMP/web-build-standard.txt"
          pnpm --filter web build

      - name: Build dependency regressions
        run: node --test scripts/security/braces-depth.test.mjs scripts/security/source-map-offsets.test.mjs

      - name: Offline shell reconciliation regressions
        run: node --test scripts/pwa/offline-shell.test.mjs

      - name: Ordinary-user recovery and bounded attachment regressions
        run: node --test scripts/ux/*.test.mjs

      - name: Dependency audit from official npm registry
        run: |
          set +e
          pnpm audit --registry=https://registry.npmjs.org --json > "$RUNNER_TEMP/dependency-audit.json"
          audit_status=$?
          set -e
          if [ "$audit_status" -gt 1 ]; then
            echo "The official npm audit source could not be queried (exit $audit_status)."
            exit "$audit_status"
          fi
          node scripts/check-dependency-audit.mjs \
            "$RUNNER_TEMP/dependency-audit.json" \
            security/dependency-exceptions.json \
            "$RUNNER_TEMP/dependency-audit-report.json"
          printf 'audit_source=https://registry.npmjs.org\naudit_timestamp=%s\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$RUNNER_TEMP/dependency-audit-source.txt"

      - name: Start API and worker for browser integration
        run: |
          cd apps/api
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > "$RUNNER_TEMP/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
          nohup python -m app.workers.import_worker > "$RUNNER_TEMP/worker.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/worker.pid"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Context and Skill upload proxy transport
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx-light
          python scripts/verify-context-upload-proxy.py

      - name: Adaptive Import recovery browser flow
        timeout-minutes: 20
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: adaptive-import-recovery
          E2E_IMPORT_FLOW: "1"
        run: >-
          pnpm --filter web exec playwright test --config=playwright.config.ts
          e2e/import-markdown.spec.ts

      - name: Release H enforced CSP browser matrix
        timeout-minutes: 20
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: csp-enforcement
        run: >-
          pnpm --filter web exec playwright test --config=playwright.config.ts
          e2e/csp-enforcement.spec.ts

      - name: Context files, export and reader recovery
        timeout-minutes: 20
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: context-files
          E2E_CONTEXT_EXPORT: "1"
          E2E_CONTEXT_BUNDLES: "1"
        run: >-
          pnpm --filter web exec playwright test --config=playwright.config.ts
          e2e/context-continuation.spec.ts
          e2e/context-guidance.spec.ts
          e2e/context-continuation-drop.spec.ts
          e2e/context-reading-tools.spec.ts
          e2e/context-drafts.spec.ts
          e2e/context-export-options.spec.ts
          e2e/context-offline-parity.spec.ts
          e2e/context-skill-bundles.spec.ts

      - name: Focused online browser and security checks
        timeout-minutes: 30
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: focused-online-security
          E2E_RICH_MARKDOWN: "1"
          E2E_LONG_READER: "1"
          E2E_SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
        run: >-
          pnpm --filter web exec playwright test --config=playwright.config.ts
          e2e/release-security-baseline.spec.ts
          e2e/ai-rich-markdown-contract.spec.ts
          e2e/ai-rich-markdown.spec.ts
          e2e/attachment-viewer-presentation.spec.ts
          e2e/reader-restoration.spec.ts
          e2e/release-stabilization-contract.spec.ts

      - name: Release H Share focus checks
        timeout-minutes: 20
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: share-focus
          E2E_SHARE_DRAWER_FOCUS: "1"
        run: >-
          pnpm --filter web exec playwright test --config=playwright.config.ts
          e2e/share-drawer-focus.spec.ts

      - name: Release H Source Editor and mutation cache checks
        timeout-minutes: 20
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: source-editor-mutation
          E2E_MUTATION_FLOW: "1"
        run: >-
          pnpm --filter web exec playwright test --config=playwright.config.ts
          e2e/release-mutation-lifecycle.spec.ts
          e2e/ux-whole-site.spec.ts
          e2e/ux-recovery-followup.spec.ts
          e2e/manual-markdown-fidelity.spec.ts

      - name: Source Editor content cleanup browser gate
        timeout-minutes: 20
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: source-editor-cleanup
          E2E_CONTENT_CLEANUP: "1"
        run: >-
          pnpm --filter web exec playwright test --config=playwright.config.ts
          e2e/content-cleanup.spec.ts

      - name: Release I upload-token atomicity matrix
        timeout-minutes: 20
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: upload-token-atomicity
          E2E_ATTACHMENT_UPLOAD: "1"
        run: >-
          pnpm --filter web exec playwright test --config=playwright.config.ts
          e2e/source-editor-upload-atomicity.spec.ts
          e2e/attachment-upload-flow.spec.ts

      - name: Release H Markdown and image Viewer checks
        timeout-minutes: 20
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: markdown-image-viewer
          E2E_RICH_MARKDOWN_ATTACHMENT: "1"
        run: >-
          pnpm --filter web exec playwright test --config=playwright.config.ts
          e2e/ai-rich-markdown-attachment.spec.ts
          e2e/attachment-reading.spec.ts

      - name: PDF.js maintained-line browser checks
        timeout-minutes: 20
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: pdfjs-maintained-line
          E2E_PDFJS_MIGRATION: "1"
          E2E_SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
        run: >-
          pnpm --filter web exec playwright test --config=playwright.config.ts
          e2e/pdfjs-migration.spec.ts
          e2e/pdfjs-share.spec.ts

      - name: Default PWA baseline
        timeout-minutes: 30
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: default-pwa
          E2E_SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
        run: pnpm --filter web exec playwright test --config=playwright.config.ts

      - name: Single-owner authentication browser gate
        timeout-minutes: 20
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: single-owner-auth
          AUTH_ENABLED: "true"
          AUTH_SESSION_SECRET: ci-only-auth-session-secret-012345678901234567890
          AUTH_COOKIE_SECURE: "false"
          AUTH_ACTIVITY_TOUCH_INTERVAL_SECONDS: "600"
          AUTH_INACTIVITY_TIMEOUT_SECONDS: "172800"
          E2E_AUTH_EMAIL: auth-ci@example.test
        run: |
          export E2E_AUTH_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24) + "-owner")')"
          cd apps/api
          python - <<'PY'
          import os
          from app.core.config import get_settings
          from app.core.database import SessionLocal
          from app.services.auth import provision_owner
          with SessionLocal() as db:
              principal = provision_owner(db, os.environ["E2E_AUTH_PASSWORD"], get_settings())
              principal.user.normalized_email = os.environ["E2E_AUTH_EMAIL"]
              db.commit()
          PY
          kill "$(cat "$RUNNER_TEMP/api.pid")" || true
          nohup env AUTH_ENABLED=true AUTH_SESSION_SECRET="$AUTH_SESSION_SECRET" AUTH_COOKIE_SECURE=false \
            uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > "$RUNNER_TEMP/auth-api.log" 2>&1 &
          auth_api_pid=$!
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then break; fi
            sleep 1
          done
          cd ../..
          E2E_AUTH=1 E2E_AUTH_PASSWORD="$E2E_AUTH_PASSWORD" \
            pnpm --filter web exec playwright test --config=playwright.config.ts e2e/auth-gate.spec.ts e2e/auth-recovery.spec.ts
          kill "$auth_api_pid" || true
          cd apps/api
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > "$RUNNER_TEMP/api.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then break; fi
            sleep 1
          done

      - name: Release E production-build PWA negative matrix
        timeout-minutes: 30
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: pwa-negative
          E2E_PWA_NEGATIVE: "1"
          NEXT_PUBLIC_PWA_NEGATIVE_TESTS: "1"
          NEXT_DIST_DIR: ".next-pwa-negative"
          RELEASE_E_PROFILE_ROOT: ${{ runner.temp }}/release-e-profiles
        run: |
          /usr/bin/time -f 'build=pwa-negative
          elapsed_seconds=%e
          max_rss_kb=%M' \
            -o "$RUNNER_TEMP/web-build-pwa-negative.txt" \
            pnpm --filter web build
          pnpm --filter web exec playwright test --config=playwright.config.ts e2e/pwa-negative.spec.ts

      - name: Build machine-readable browser gate summary
        if: always()
        env:
          PLAYWRIGHT_EXPECTED_GATES: adaptive-import-recovery,csp-enforcement,context-files,focused-online-security,share-focus,source-editor-mutation,source-editor-cleanup,upload-token-atomicity,markdown-image-viewer,pdfjs-maintained-line,default-pwa,single-owner-auth,pwa-negative
        run: >-
          node apps/web/e2e/gate-summary.mjs
          apps/web/test-results
          apps/web/test-results/release-gate-summary.json

      - name: Upload non-deployable quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-a-quality-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dependency-audit.json
            ${{ runner.temp }}/dependency-audit-report.json
            ${{ runner.temp }}/dependency-audit-source.txt
            ${{ runner.temp }}/web-build-standard.txt
            ${{ runner.temp }}/web-build-pwa-negative.txt
            ${{ runner.temp }}/pnpm-cache.txt
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/worker.log
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 14

  settings-quality:
    runs-on: ubuntu-latest
    # The serial 439-case matrix took 41.8m in 37795767145; setup plus the
    # passing fresh-instance restore exceeded 45m. Keep per-case bounds intact.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chat_reader
          POSTGRES_USER: chat_reader
          POSTGRES_PASSWORD: chat_reader_ci
        ports:
          # Keep the disposable fixture on a port allowed by the guarded seeders.
          - 65438:5432
        options: >-
          --health-cmd "pg_isready -U chat_reader -d chat_reader"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://chat_reader:chat_reader_ci@127.0.0.1:65438/chat_reader
      AUTH_ENABLED: "true"
      AUTH_SESSION_SECRET: synthetic-settings-ci-session-secret-0123456789
      AUTH_COOKIE_SECURE: "false"
      E2E_SETTINGS_MAILBOX: "1"
      IMPORT_COMMIT_INLINE: "true"
      E2E_AUTH_EMAIL: settings-ci@example.test
      E2E_AUTH_PASSWORD: synthetic-settings-ci-admin-passphrase
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "8320"
      SMTP_STARTTLS: "false"
      SMTP_FROM_ADDRESS: noreply@example.test
      PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
      PLAYWRIGHT_GATE_ID: settings-stages-1-4
      NEXT_PUBLIC_PWA_NEGATIVE_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install and migrate disposable fixture
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install -e apps/api
          mkdir -p "$IMPORT_STORAGE_DIR" "$EXPORT_STORAGE_DIR" "$OFFLINE_STORAGE_DIR" "$ASSET_STORAGE_DIR"
          cd apps/api
          python -m alembic upgrade head
      - name: Build authenticated Web and install Chromium
        run: |
          pnpm --filter web build
          pnpm --filter web exec playwright install --with-deps chromium
      - name: Real settings, SMTP, offline and sync browser matrix
        env:
          E2E_CONTEXT_ADMIN: "1"
        run: |
          cd apps/api
          uvicorn settings_browser_fixture:app --app-dir tests --host 127.0.0.1 --port 8000 --no-access-log > "$RUNNER_TEMP/settings-api.log" 2>&1 &
          settings_api_pid=$!
          python -m app.workers.import_worker > "$RUNNER_TEMP/settings-worker.log" 2>&1 &
          settings_worker_pid=$!
          trap 'kill "$settings_api_pid" "$settings_worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          cd ../..
          pnpm --filter web exec playwright test --config=playwright.config.ts 'e2e/settings-.*\.spec\.ts' e2e/context-admin-bundles.spec.ts
          PLAYWRIGHT_EXPECTED_GATES=settings-stages-1-4 node apps/web/e2e/gate-summary.mjs apps/web/test-results apps/web/test-results/settings-gate-summary.json
      - name: System archive restore into a fresh PostgreSQL instance
        run: |
          export E2E_SYSTEM_ARCHIVE_SOURCE="$RUNNER_TEMP/synthetic-system.cr"
          cd apps/api
          python tests/build_system_archive_browser_fixture.py
          python - <<'PY'
          import os
          from pathlib import Path
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["DATABASE_URL"], isolation_level="AUTOCOMMIT")
          with engine.connect() as db:
              db.execute(text('CREATE DATABASE "chat_reader_archive_restore"'))
          url = engine.url.set(database="chat_reader_archive_restore").render_as_string(hide_password=False)
          Path(os.environ["RUNNER_TEMP"], "archive-database-url").write_text(url)
          PY
          export DATABASE_URL="$(cat "$RUNNER_TEMP/archive-database-url")"
          export IMPORT_STORAGE_DIR="$RUNNER_TEMP/archive-restore/imports"
          export EXPORT_STORAGE_DIR="$RUNNER_TEMP/archive-restore/exports"
          export OFFLINE_STORAGE_DIR="$RUNNER_TEMP/archive-restore/offline"
          export ASSET_STORAGE_DIR="$RUNNER_TEMP/archive-restore/assets"
          mkdir -p "$IMPORT_STORAGE_DIR" "$EXPORT_STORAGE_DIR" "$OFFLINE_STORAGE_DIR" "$ASSET_STORAGE_DIR"
          python -m alembic upgrade head
          uvicorn settings_browser_fixture:app --app-dir tests --host 127.0.0.1 --port 8000 --no-access-log > "$RUNNER_TEMP/archive-api.log" 2>&1 &
          archive_api_pid=$!
          python -m app.workers.import_worker > "$RUNNER_TEMP/archive-worker.log" 2>&1 &
          archive_worker_pid=$!
          trap 'kill "$archive_api_pid" "$archive_worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          cd ../..
          PLAYWRIGHT_GATE_ID=system-archive-new-instance pnpm --filter web exec playwright test --config=playwright.config.ts e2e/system-archive-new-instance.spec.ts
          PLAYWRIGHT_EXPECTED_GATES=settings-stages-1-4,system-archive-new-instance node apps/web/e2e/gate-summary.mjs apps/web/test-results apps/web/test-results/settings-gate-summary.json
      - name: Upload settings quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-quality-evidence-${{ github.sha }}
          path: |
            apps/web/test-results
            ${{ runner.temp }}/settings-api.log
            ${{ runner.temp }}/settings-worker.log
            ${{ runner.temp }}/archive-api.log
            ${{ runner.temp }}/archive-worker.log
          retention-days: 14

  build-images:
    needs: [api-quality, web-quality, settings-quality]
    if: ${{ needs.api-quality.result == 'success' && needs.web-quality.result == 'success' && needs.settings-quality.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.release_artifact.outputs.artifact-id }}
      producer_attempt: ${{ steps.provenance.outputs.attempt }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Record image build metadata
        run: echo "IMAGE_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Record artifact producer attempt
        id: provenance
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Build API and worker image
        run: |
          docker build \
            --build-arg BUILD_REVISION="${GITHUB_SHA}" \
            --label org.opencontainers.image.created="${IMAGE_BUILD_TIME}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag chat-reader-api:${GITHUB_SHA} apps/api
          docker tag chat-reader-api:${GITHUB_SHA} chat-reader-import-worker:${GITHUB_SHA}
          docker tag chat-reader-api:${GITHUB_SHA} chat-reader-migrate:${GITHUB_SHA}

      - name: Build Web image
        run: |
          docker build \
            --file apps/web/Dockerfile \
            --build-arg API_INTERNAL_URL=http://api:8000 \
            --build-arg BUILD_REVISION="${GITHUB_SHA}" \
            --build-arg COMPLEX_ATTACHMENT_PREVIEW_ENABLED=false \
            --build-arg WEB_BUILD_HEAP_MB=2048 \
            --label org.opencontainers.image.created="${IMAGE_BUILD_TIME}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag chat-reader-web:${GITHUB_SHA} \
            .

      - name: Inspect release images
        run: bash scripts/inspect-release-images.sh "${GITHUB_SHA}"

      - name: Package images and provenance
        run: |
          docker save \
            chat-reader-api:${GITHUB_SHA} \
            chat-reader-import-worker:${GITHUB_SHA} \
            chat-reader-migrate:${GITHUB_SHA} \
            chat-reader-web:${GITHUB_SHA} \
            | gzip -1 > chat-reader-images.tar.gz
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg built_at "$IMAGE_BUILD_TIME" \
            --arg archive "chat-reader-images.tar.gz" \
            --arg api_image_id "$(docker image inspect -f '{{.Id}}' chat-reader-api:${GITHUB_SHA})" \
            --arg web_image_id "$(docker image inspect -f '{{.Id}}' chat-reader-web:${GITHUB_SHA})" \
            '{schema_version: 2, commit: $commit, workflow_run_id: $run_id, workflow_run_attempt: $run_attempt, built_at: $built_at, archive: $archive, images: {api: $api_image_id, web: $web_image_id}, diagnostics_gateway: {path: "deploy/nginx-internal-diagnostics.location.conf"}}' \
            > release-manifest.json

      - name: Upload deployable release artifact
        id: release_artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-reader-images-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            chat-reader-images.tar.gz
            release-manifest.json
            image-inspection.json
            deploy/nginx-internal-diagnostics.location.conf
          if-no-files-found: error
          retention-days: 3

  inspect-release-artifact:
    needs: build-images
    if: ${{ needs.build-images.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_ARTIFACT_ID: ${{ needs.build-images.outputs.artifact_id }}
      ARTIFACT_PRODUCER_ATTEMPT: ${{ needs.build-images.outputs.producer_attempt }}
    steps:
      - name: Require the successful producer's artifact reference
        run: |
          case "$RELEASE_ARTIFACT_ID" in ''|*[!0-9]*) exit 1 ;; esac
          test "$RELEASE_ARTIFACT_ID" -ge 1
          case "$ARTIFACT_PRODUCER_ATTEMPT" in ''|*[!0-9]*) exit 1 ;; esac
          test "$ARTIFACT_PRODUCER_ATTEMPT" -ge 1
          test "$ARTIFACT_PRODUCER_ATTEMPT" -le "$GITHUB_RUN_ATTEMPT"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-images.outputs.artifact_id }}
          merge-multiple: true
          path: release-artifact

      - name: Inspect downloaded release archive independently
        working-directory: release-artifact
        run: |
          set -euo pipefail
          test -s chat-reader-images.tar.gz
          test -s release-manifest.json
          test -s image-inspection.json
          jq -e --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$ARTIFACT_PRODUCER_ATTEMPT" \
            '.schema_version == 2 and .commit == $sha and .workflow_run_id == $run
              and .workflow_run_attempt == $attempt and .archive == "chat-reader-images.tar.gz"
              and (.images.api | test("^sha256:[a-f0-9]{64}$"))
              and (.images.web | test("^sha256:[a-f0-9]{64}$"))' release-manifest.json >/dev/null
          jq -e --arg sha "$GITHUB_SHA" \
            '.revision == $sha and .forbidden_paths_present == false and (.images | length == 4)' \
            image-inspection.json >/dev/null
          docker load --input chat-reader-images.tar.gz >"$RUNNER_TEMP/chat-reader-docker-load.txt"
          for image in api import-worker migrate web; do
            image_ref="chat-reader-${image}:${GITHUB_SHA}"
            revision="$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_ref")"
            test "$revision" = "$GITHUB_SHA"
            image_id="$(docker image inspect -f '{{.Id}}' "$image_ref")"
            case "$image" in web) role=web ;; *) role=api ;; esac
            test "$image_id" = "$(jq -r --arg role "$role" '.images[$role]' release-manifest.json)"
            test "$(docker image inspect -f '{{.Os}}/{{.Architecture}}' "$image_ref")" = "linux/amd64"
            jq -e --arg name "$image_ref" --arg id "$image_id" \
              '[.images[] | select(.name == $name and .id == $id)] | length == 1' \
              image-inspection.json >/dev/null
          done
