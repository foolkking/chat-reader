name: Performance characterization

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ENV: test
  DATABASE_URL: postgresql+psycopg://chat_reader:chat_reader_ci@127.0.0.1:5432/chat_reader
  ATTACHMENT_CURSOR_SECRET: synthetic-ci-attachment-cursor-secret-at-least-32-characters
  API_INTERNAL_URL: http://127.0.0.1:8000
  PUBLIC_WEB_BASE_URL: http://127.0.0.1:3107
  CORS_ORIGINS: http://127.0.0.1:3107
  IMPORT_STORAGE_DIR: /tmp/chat-reader/perf/imports
  EXPORT_STORAGE_DIR: /tmp/chat-reader/perf/exports
  OFFLINE_STORAGE_DIR: /tmp/chat-reader/perf/offline
  ASSET_STORAGE_DIR: /tmp/chat-reader/perf/assets
  POSTGRES_EXPORT_INTEGRATION: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chat_reader
          POSTGRES_USER: chat_reader
          POSTGRES_PASSWORD: chat_reader_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat_reader -d chat_reader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install --upgrade pip
          python -m pip install -e apps/api
      - name: Prepare schema
        run: |
          mkdir -p "$IMPORT_STORAGE_DIR" "$EXPORT_STORAGE_DIR" "$OFFLINE_STORAGE_DIR" "$ASSET_STORAGE_DIR"
          cd apps/api
          python -m alembic upgrade head
      - name: Web lint
        run: pnpm --filter web lint
      - name: Web typecheck
        run: pnpm --filter web typecheck
      - name: Web production build
        run: pnpm --filter web build
      - name: API full suite
        run: cd apps/api && pytest
      - name: Alembic single head
        run: |
          cd apps/api
          test "$(python -m alembic heads)" = "20260822_0025 (head)"
          python -m alembic current | grep -F "20260822_0025"

  benchmark:
    needs: quality
    if: ${{ needs.quality.result == 'success' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chat_reader
          POSTGRES_USER: chat_reader
          POSTGRES_PASSWORD: chat_reader_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat_reader -d chat_reader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install --upgrade pip
          python -m pip install -e apps/api
      - name: Prepare schema and benchmark roots
        run: |
          mkdir -p "$IMPORT_STORAGE_DIR" "$EXPORT_STORAGE_DIR" "$OFFLINE_STORAGE_DIR" "$ASSET_STORAGE_DIR" benchmark-results
          cd apps/api
          python -m alembic upgrade head
      - name: Start API and worker
        run: |
          cd apps/api
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > "$RUNNER_TEMP/perf-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/perf-api.pid"
          nohup python -m app.workers.import_worker > "$RUNNER_TEMP/perf-worker.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/perf-worker.pid"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/perf-api.log"
          exit 1
      - name: Record benchmark environment
        run: |
          {
            uname -a
            lscpu
            free -b
            df -B1 "$RUNNER_TEMP"
            python --version
            node --version
            pnpm --version
            psql --version
            psql "postgresql://chat_reader:chat_reader_ci@127.0.0.1:5432/chat_reader" \
              -c "SHOW shared_buffers; SHOW work_mem; SHOW effective_cache_size; SHOW max_connections;"
          } > benchmark-results/environment.txt
      - name: Run backend capacity measurements
        run: |
          export BENCHMARK_API_PID="$(cat "$RUNNER_TEMP/perf-api.pid")"
          export BENCHMARK_WORKER_PID="$(cat "$RUNNER_TEMP/perf-worker.pid")"
          for profile in plain math mixed attachment_metadata; do
            for messages in 398 1000 10000; do
              python scripts/performance/run_backend_benchmark.py \
                --profile "$profile" --messages "$messages" \
                --api-pid "$BENCHMARK_API_PID" --worker-pid "$BENCHMARK_WORKER_PID" \
                --output "benchmark-results/api-${profile}-${messages}.json"
            done
          done
          python scripts/performance/run_backend_benchmark.py \
            --profile large_message --messages 10 \
            --api-pid "$BENCHMARK_API_PID" --worker-pid "$BENCHMARK_WORKER_PID" \
            --output benchmark-results/api-large-message.json
      - name: Query characterization
        run: |
          DB_URL="postgresql://chat_reader:chat_reader_ci@127.0.0.1:5432/chat_reader"
          psql -XAt "$DB_URL" -c "EXPLAIN (ANALYZE, BUFFERS, FORMAT JSON) WITH target AS (SELECT id FROM conversations ORDER BY message_count DESC, imported_at DESC LIMIT 1) SELECT m.id, m.order_key, v.id, v.display_text FROM messages m JOIN message_versions v ON v.id = m.current_version_id WHERE m.conversation_id = (SELECT id FROM target) ORDER BY m.order_key LIMIT 50" > benchmark-results/explain-reader.json
          psql -XAt "$DB_URL" -c "EXPLAIN (ANALYZE, BUFFERS, FORMAT JSON) WITH target AS (SELECT conversation_id AS id FROM attachments WHERE deleted_at IS NULL GROUP BY conversation_id ORDER BY count(*) DESC LIMIT 1) SELECT id, status, asset_object_id FROM attachments WHERE conversation_id = (SELECT id FROM target) AND deleted_at IS NULL ORDER BY created_at DESC LIMIT 100" > benchmark-results/explain-attachments.json
          psql -XAt "$DB_URL" -c "EXPLAIN (ANALYZE, BUFFERS, FORMAT JSON) WITH target AS (SELECT id FROM conversations ORDER BY message_count DESC, imported_at DESC LIMIT 1) SELECT m.id, m.order_key, v.display_text FROM messages m JOIN message_versions v ON v.id = m.current_version_id WHERE m.conversation_id = (SELECT id FROM target) ORDER BY m.order_key" > benchmark-results/explain-export.json
          psql -XAt "$DB_URL" -c "EXPLAIN (ANALYZE, BUFFERS, FORMAT JSON) SELECT id, offline_revision, message_count FROM conversations WHERE deleted_at IS NULL AND status = 'active' ORDER BY sort_time DESC, id ASC LIMIT 100" > benchmark-results/explain-offline.json
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-characterization-${{ github.sha }}
          path: |
            benchmark-results
            apps/web/playwright-report
            apps/web/test-results
            ${{ runner.temp }}/perf-api.log
            ${{ runner.temp }}/perf-worker.log
          if-no-files-found: warn
          retention-days: 14

  regression:
    needs: quality
    if: ${{ needs.quality.result == 'success' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chat_reader
          POSTGRES_USER: chat_reader
          POSTGRES_PASSWORD: chat_reader_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat_reader -d chat_reader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install dependencies and prepare production build
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install --upgrade pip
          python -m pip install -e apps/api
          mkdir -p "$IMPORT_STORAGE_DIR" "$EXPORT_STORAGE_DIR" "$OFFLINE_STORAGE_DIR" "$ASSET_STORAGE_DIR"
          (cd apps/api && python -m alembic upgrade head)
          pnpm --filter web build
      - name: Start API and worker
        run: |
          cd apps/api
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > "$RUNNER_TEMP/regression-api.log" 2>&1 &
          nohup python -m app.workers.import_worker > "$RUNNER_TEMP/regression-worker.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Release A/B/C and Reader focused browser regression
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          E2E_RICH_MARKDOWN: "1"
          E2E_SHARE_DRAWER_FOCUS: "1"
          E2E_LONG_READER: "1"
          E2E_READER_PERF_BUDGET: "1"
        run: >-
          pnpm --filter web exec playwright test --config=playwright.config.ts
          e2e/release-security-baseline.spec.ts
          e2e/ai-rich-markdown-contract.spec.ts
          e2e/ai-rich-markdown.spec.ts
          e2e/share-drawer-focus.spec.ts
          e2e/reader-restoration.spec.ts
      - name: Default PWA matrix
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
        run: pnpm --filter web exec playwright test --config=playwright.config.ts
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-d-regression-${{ github.sha }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            ${{ runner.temp }}/regression-api.log
            ${{ runner.temp }}/regression-worker.log
          if-no-files-found: warn
          retention-days: 14

  reader-capacity:
    needs: quality
    if: ${{ needs.quality.result == 'success' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chat_reader
          POSTGRES_USER: chat_reader
          POSTGRES_PASSWORD: chat_reader_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat_reader -d chat_reader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install --upgrade pip
          python -m pip install -e apps/api
      - name: Prepare schema and build Web
        run: |
          mkdir -p "$IMPORT_STORAGE_DIR" "$EXPORT_STORAGE_DIR" "$OFFLINE_STORAGE_DIR" "$ASSET_STORAGE_DIR"
          (cd apps/api && python -m alembic upgrade head)
          pnpm --filter web build
      - name: Start API and worker
        run: |
          cd apps/api
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > "$RUNNER_TEMP/reader-api.log" 2>&1 &
          nohup python -m app.workers.import_worker > "$RUNNER_TEMP/reader-worker.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Run Reader capacity characterization
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          E2E_READER_CAPACITY: "1"
        run: pnpm --filter web exec playwright test --config=playwright.config.ts e2e/reader-capacity.spec.ts
      - name: Upload Reader evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-capacity-${{ github.sha }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            ${{ runner.temp }}/reader-api.log
            ${{ runner.temp }}/reader-worker.log
          if-no-files-found: warn
          retention-days: 14

  cr-capacity:
    needs: quality
    if: ${{ needs.quality.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scale: current
            messages: 398
          - scale: 2x
            messages: 796
          - scale: 10x
            messages: 3980
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chat_reader
          POSTGRES_USER: chat_reader
          POSTGRES_PASSWORD: chat_reader_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat_reader -d chat_reader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API and prepare isolated databases
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e apps/api
          mkdir -p "$IMPORT_STORAGE_DIR" "$EXPORT_STORAGE_DIR" "$OFFLINE_STORAGE_DIR" "$ASSET_STORAGE_DIR" benchmark-results
          (cd apps/api && python -m alembic upgrade head)
          createdb -h 127.0.0.1 -U chat_reader "chat_reader_restore_${{ matrix.messages }}"
          DATABASE_URL="postgresql+psycopg://chat_reader:chat_reader_ci@127.0.0.1:5432/chat_reader_restore_${{ matrix.messages }}" \
            bash -c 'cd apps/api && python -m alembic upgrade head'
        env:
          PGPASSWORD: chat_reader_ci
      - name: Start isolated API and worker
        run: |
          cd apps/api
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > "$RUNNER_TEMP/cr-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cr-api.pid"
          nohup python -m app.workers.import_worker > "$RUNNER_TEMP/cr-worker.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cr-worker.pid"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Measure system archive export and restore
        run: |
          python scripts/performance/run_backend_benchmark.py \
            --profile attachment_metadata --messages "${{ matrix.messages }}" --system-archive \
            --api-pid "$(cat "$RUNNER_TEMP/cr-api.pid")" --worker-pid "$(cat "$RUNNER_TEMP/cr-worker.pid")" \
            --output "benchmark-results/cr-v4-${{ matrix.scale }}.json"
          DATABASE_URL="postgresql+psycopg://chat_reader:chat_reader_ci@127.0.0.1:5432/chat_reader_restore_${{ matrix.messages }}" \
            python scripts/performance/restore_cr_benchmark.py \
              --archive "benchmark-results/cr-v4-${{ matrix.scale }}.cr" \
              --output "benchmark-results/cr-v4-restore-${{ matrix.scale }}.json"
      - name: Upload system archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cr-capacity-${{ matrix.scale }}-${{ github.sha }}
          path: |
            benchmark-results
            ${{ runner.temp }}/cr-api.log
            ${{ runner.temp }}/cr-worker.log
          if-no-files-found: warn
          retention-days: 14
