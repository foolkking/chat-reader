name: Performance characterization

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ENV: test
  DATABASE_URL: postgresql+psycopg://chat_reader:chat_reader_ci@127.0.0.1:5432/chat_reader
  ATTACHMENT_CURSOR_SECRET: synthetic-ci-attachment-cursor-secret-at-least-32-characters
  API_INTERNAL_URL: http://127.0.0.1:8000
  PUBLIC_WEB_BASE_URL: http://127.0.0.1:3107
  CORS_ORIGINS: http://127.0.0.1:3107
  IMPORT_STORAGE_DIR: /tmp/chat-reader/perf/imports
  EXPORT_STORAGE_DIR: /tmp/chat-reader/perf/exports
  OFFLINE_STORAGE_DIR: /tmp/chat-reader/perf/offline
  ASSET_STORAGE_DIR: /tmp/chat-reader/perf/assets
  POSTGRES_EXPORT_INTEGRATION: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chat_reader
          POSTGRES_USER: chat_reader
          POSTGRES_PASSWORD: chat_reader_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat_reader -d chat_reader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20.13.1"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install --upgrade pip
          python -m pip install -e apps/api
      - name: Prepare schema
        run: |
          mkdir -p "$IMPORT_STORAGE_DIR" "$EXPORT_STORAGE_DIR" "$OFFLINE_STORAGE_DIR" "$ASSET_STORAGE_DIR"
          cd apps/api
          python -m alembic upgrade head
      - name: Web lint
        run: pnpm run lint
      - name: Web typecheck
        run: pnpm run typecheck
      - name: Web production build
        run: pnpm --filter web build
      - name: API full suite
        run: pnpm run test:api
      - name: Alembic single head
        run: |
          cd apps/api
          test "$(python -m alembic heads)" = "20260806_0021 (head)"
          python -m alembic current | grep -F "20260806_0021 (head)"

  benchmark:
    needs: quality
    if: ${{ needs.quality.result == 'success' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chat_reader
          POSTGRES_USER: chat_reader
          POSTGRES_PASSWORD: chat_reader_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat_reader -d chat_reader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20.13.1"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install --upgrade pip
          python -m pip install -e apps/api
      - name: Prepare schema and benchmark roots
        run: |
          mkdir -p "$IMPORT_STORAGE_DIR" "$EXPORT_STORAGE_DIR" "$OFFLINE_STORAGE_DIR" "$ASSET_STORAGE_DIR" benchmark-results
          cd apps/api
          python -m alembic upgrade head
      - name: Build Web for browser characterization
        run: pnpm --filter web build
      - name: Start API and worker
        run: |
          cd apps/api
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > "$RUNNER_TEMP/perf-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/perf-api.pid"
          nohup python -m app.workers.import_worker > "$RUNNER_TEMP/perf-worker.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/perf-worker.pid"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/perf-api.log"
          exit 1
      - name: Run backend capacity measurements
        run: |
          export BENCHMARK_API_PID="$(cat "$RUNNER_TEMP/perf-api.pid")"
          export BENCHMARK_WORKER_PID="$(cat "$RUNNER_TEMP/perf-worker.pid")"
          for profile in plain math mixed attachment_metadata; do
            for messages in 398 1000 10000; do
              python scripts/performance/run_backend_benchmark.py \
                --profile "$profile" --messages "$messages" \
                --api-pid "$BENCHMARK_API_PID" --worker-pid "$BENCHMARK_WORKER_PID" \
                --output "benchmark-results/api-${profile}-${messages}.json"
            done
          done
          for messages in 398 1000 10000; do
            psql "postgresql://chat_reader:chat_reader_ci@127.0.0.1:5432/chat_reader" \
              -v ON_ERROR_STOP=1 -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
            (cd apps/api && python -m alembic upgrade head)
            python scripts/performance/run_backend_benchmark.py \
              --profile plain --messages "$messages" --system-archive \
              --api-pid "$BENCHMARK_API_PID" --worker-pid "$BENCHMARK_WORKER_PID" \
              --output "benchmark-results/cr-v4-${messages}.json"
            restore_db="chat_reader_restore_${messages}"
            psql "postgresql://chat_reader:chat_reader_ci@127.0.0.1:5432/postgres" \
              -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS $restore_db; CREATE DATABASE $restore_db;"
            DATABASE_URL="postgresql+psycopg://chat_reader:chat_reader_ci@127.0.0.1:5432/$restore_db" \
              bash -c 'cd apps/api && python -m alembic upgrade head'
            DATABASE_URL="postgresql+psycopg://chat_reader:chat_reader_ci@127.0.0.1:5432/$restore_db" \
              python scripts/performance/restore_cr_benchmark.py \
                --archive "benchmark-results/cr-v4-${messages}.cr" \
                --output "benchmark-results/cr-v4-restore-${messages}.json"
          done
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Run Reader capacity characterization
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          E2E_READER_CAPACITY: "1"
        run: pnpm --filter web exec playwright test --config=playwright.config.ts e2e/reader-capacity.spec.ts
      - name: Query characterization
        run: |
          psql "postgresql://chat_reader:chat_reader_ci@127.0.0.1:5432/chat_reader" -c "EXPLAIN (ANALYZE, BUFFERS, FORMAT JSON) SELECT id, conversation_id, order_key FROM messages ORDER BY created_at DESC LIMIT 50" > benchmark-results/explain-reader.json
          psql "postgresql://chat_reader:chat_reader_ci@127.0.0.1:5432/chat_reader" -c "EXPLAIN (ANALYZE, BUFFERS, FORMAT JSON) SELECT id, conversation_id, status FROM attachments WHERE deleted_at IS NULL ORDER BY created_at DESC LIMIT 100" > benchmark-results/explain-attachments.json
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-characterization-${{ github.sha }}
          path: |
            benchmark-results
            apps/web/playwright-report
            apps/web/test-results
            ${{ runner.temp }}/perf-api.log
            ${{ runner.temp }}/perf-worker.log
          if-no-files-found: warn
          retention-days: 14
