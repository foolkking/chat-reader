name: Web quality gates

on:
  workflow_call:
    inputs:
      shard:
        required: true
        type: number

permissions:
  contents: read

# Caller workflow env does not propagate through workflow_call.
# These are the same synthetic fixture inputs as the exact full release.
env:
  APP_ENV: test
  DATABASE_URL: postgresql+psycopg://chat_reader:chat_reader_ci@127.0.0.1:5432/chat_reader
  ATTACHMENT_CURSOR_SECRET: synthetic-ci-attachment-cursor-secret-at-least-32-characters
  API_INTERNAL_URL: http://127.0.0.1:8000
  PUBLIC_WEB_BASE_URL: http://127.0.0.1:3107
  CORS_ORIGINS: http://127.0.0.1:3107
  IMPORT_STORAGE_DIR: /tmp/chat-reader/imports
  EXPORT_STORAGE_DIR: /tmp/chat-reader/exports
  OFFLINE_STORAGE_DIR: /tmp/chat-reader/offline
  ASSET_STORAGE_DIR: /tmp/chat-reader/assets
  POSTGRES_EXPORT_INTEGRATION: "1"

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      CI_QUALITY_SHARD: ${{ inputs.shard }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate fixed independent shard
        shell: bash
        run: |
          case "$CI_QUALITY_SHARD" in 1|2|3) ;; *) exit 1 ;; esac

      - name: Start pinned disposable PostgreSQL with official-source fallback
        id: postgres
        run: bash scripts/ci/postgres-service.sh start

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.1"

      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        id: pnpm-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Record pnpm cache evidence
        shell: bash
        run: |
          printf 'cache_hit=%s\ncache_key=%s\n' \
            '${{ steps.pnpm-cache.outputs.cache-hit }}' \
            '${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}' \
            > "$RUNNER_TEMP/pnpm-cache.txt"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-test.lock

      - name: Install locked dependencies without lifecycle scripts
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install --require-hashes -r apps/api/requirements-test.lock -r apps/api/requirements-build.lock
          python -m pip install --no-deps --no-build-isolation -e "apps/api[test]"

      - name: Prepare test services
        run: |
          mkdir -p "$IMPORT_STORAGE_DIR" "$EXPORT_STORAGE_DIR" "$OFFLINE_STORAGE_DIR" "$ASSET_STORAGE_DIR"
          cd apps/api
          python -m alembic upgrade head

      - name: Web lint
        if: ${{ inputs.shard == 1 }}
        run: pnpm --filter web lint

      - name: Web typecheck
        if: ${{ inputs.shard == 1 }}
        run: pnpm --filter web typecheck

      - name: Build dependency regressions
        if: ${{ inputs.shard == 1 }}
        run: node --test scripts/security/braces-depth.test.mjs scripts/security/source-map-offsets.test.mjs

      - name: Official release image source contract
        if: ${{ inputs.shard == 1 }}
        run: node --test scripts/ci/release-image-sources.test.mjs scripts/ci/postgres-service.test.mjs scripts/ci/image-base-sources.test.mjs

      - name: Settings completion timing source controls
        if: ${{ inputs.shard == 1 }}
        run: node --test scripts/ci/settings-completion-timing.test.mjs

      - name: Quality scheduling source and real-report controls
        if: ${{ inputs.shard == 1 }}
        run: |
          python -m unittest discover -s scripts/ci -p 'test_quality_scheduling.py' -v
          python -m unittest discover -s scripts/ci -p 'test_required_web_gates.py' -v
          python -m unittest discover -s scripts/ci -p 'test_api_shard_evidence.py' -v
          python -m unittest discover -s scripts/ci -p 'test_image_candidate.py' -v
          node --test scripts/ci/quality-shard-evidence.test.mjs
          node scripts/ci/run-release-source-controls.mjs

      - name: Offline shell reconciliation regressions
        if: ${{ inputs.shard == 1 }}
        run: node --test scripts/pwa/offline-shell.test.mjs

      - name: Ordinary-user recovery and bounded attachment regressions
        if: ${{ inputs.shard == 1 }}
        run: node --test scripts/ux/*.test.mjs

      - name: Dependency audit from official npm registry
        if: ${{ inputs.shard == 1 }}
        run: |
          set +e
          pnpm audit --registry=https://registry.npmjs.org --json > "$RUNNER_TEMP/dependency-audit.json"
          audit_status=$?
          set -e
          if [ "$audit_status" -gt 1 ]; then
            echo "The official npm audit source could not be queried (exit $audit_status)."
            exit "$audit_status"
          fi
          node scripts/check-dependency-audit.mjs \
            "$RUNNER_TEMP/dependency-audit.json" \
            security/dependency-exceptions.json \
            "$RUNNER_TEMP/dependency-audit-report.json"
          printf 'audit_source=https://registry.npmjs.org\naudit_timestamp=%s\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$RUNNER_TEMP/dependency-audit-source.txt"

      - name: Web production build (timed)
        run: >-
          /usr/bin/time -f 'build=standard
          elapsed_seconds=%e
          max_rss_kb=%M'
          -o "$RUNNER_TEMP/web-build-standard.txt"
          pnpm --filter web build

      - name: Start API and worker for browser integration
        run: |
          cd apps/api
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > "$RUNNER_TEMP/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
          nohup python -m app.workers.import_worker > "$RUNNER_TEMP/worker.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/worker.pid"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Mounted Viewer and retained mobile sheet regression
        if: ${{ inputs.shard == 3 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
        run: node scripts/ux/attachment-modal-browser.mjs

      - name: Image size commit, recovery and responsive controls
        if: ${{ inputs.shard == 2 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
        run: node scripts/ux/image-scale-slider-browser.mjs

      - name: Formula reading, focus tools and timed return regression
        if: ${{ inputs.shard == 1 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
        run: node scripts/ux/reader-interaction-browser.mjs

      - name: Cross-device reading handoff and conflict recovery
        if: ${{ inputs.shard == 2 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
        run: node scripts/ux/reading-position-browser.mjs

      - name: Retained import stop and per-task recovery controls
        if: ${{ inputs.shard == 1 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
        run: node scripts/ux/import-recovery-browser.mjs

      - name: Minimal administrator runtime and bounded read recovery
        if: ${{ inputs.shard == 1 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
        run: node scripts/ux/admin-runtime-browser.mjs

      - name: Failed and paused import source repair
        if: ${{ inputs.shard == 1 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
        run: node scripts/ux/import-source-repair-browser.mjs

      - name: Import batch disposition and scoped navigation layouts
        if: ${{ inputs.shard == 1 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
        run: |
          node scripts/ux/import-batch-browser.mjs
          node scripts/ux/navigation-import-layout-browser.mjs

      - name: Reader table export and recovery controls
        if: ${{ inputs.shard == 3 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
        run: node scripts/ux/reader-table-actions-browser.mjs

      - name: Offline per-conversation recovery and capacity choices
        if: ${{ inputs.shard == 1 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
        run: node scripts/ux/offline-recovery-browser.mjs

      - name: Export option continuity and unknown-result recovery
        if: ${{ inputs.shard == 2 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
        run: node scripts/ux/export-recovery-browser.mjs

      - name: Attachment ordered uploads and original-request recovery
        if: ${{ inputs.shard == 1 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
        run: node scripts/ux/attachment-recovery-browser.mjs

      - name: Source save snapshots, receipts and real editor transactions
        if: ${{ inputs.shard == 2 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
        run: node scripts/ux/source-editor-table-browser.mjs

      - name: Reading success feedback and explicit copy recovery
        if: ${{ inputs.shard == 3 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
        run: node scripts/ux/reading-feedback-browser.mjs

      - name: Merged attachment recovery result and retained original navigation
        if: ${{ inputs.shard == 3 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
        run: node scripts/ux/merge-attachment-result-browser.mjs

      - name: Context and Skill upload proxy transport
        if: ${{ inputs.shard == 1 }}
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx-light
          python scripts/verify-context-upload-proxy.py

      - name: Adaptive Import recovery browser flow
        if: ${{ inputs.shard == 1 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: adaptive-import-recovery
          E2E_IMPORT_FLOW: "1"
        run: >-
          pnpm --filter web exec playwright test --config=playwright.config.ts
          e2e/import-markdown.spec.ts

      - name: Release H enforced CSP browser matrix
        if: ${{ inputs.shard == 1 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: csp-enforcement
        run: >-
          pnpm --filter web exec playwright test --config=playwright.config.ts
          e2e/csp-enforcement.spec.ts

      - name: Context files, export and reader recovery
        if: ${{ inputs.shard == 3 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: context-files
          E2E_CONTEXT_EXPORT: "1"
          E2E_CONTEXT_BUNDLES: "1"
        run: >-
          pnpm --filter web exec playwright test --config=playwright.config.ts
          e2e/context-continuation.spec.ts
          e2e/context-guidance.spec.ts
          e2e/context-continuation-drop.spec.ts
          e2e/context-reading-tools.spec.ts
          e2e/context-drafts.spec.ts
          e2e/context-export-options.spec.ts
          e2e/context-offline-parity.spec.ts
          e2e/context-skill-bundles.spec.ts

      - name: Focused online browser and security checks
        if: ${{ inputs.shard == 3 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: focused-online-security
          E2E_RICH_MARKDOWN: "1"
          E2E_LONG_READER: "1"
          E2E_SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
        run: >-
          pnpm --filter web exec playwright test --config=playwright.config.ts
          e2e/release-security-baseline.spec.ts
          e2e/ai-rich-markdown-contract.spec.ts
          e2e/ai-rich-markdown.spec.ts
          e2e/attachment-viewer-presentation.spec.ts
          e2e/reader-restoration.spec.ts
          e2e/release-stabilization-contract.spec.ts

      - name: Release H Share focus checks
        if: ${{ inputs.shard == 2 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: share-focus
          E2E_SHARE_DRAWER_FOCUS: "1"
        run: >-
          pnpm --filter web exec playwright test --config=playwright.config.ts
          e2e/share-drawer-focus.spec.ts

      - name: Release H Source Editor and mutation cache checks
        if: ${{ inputs.shard == 2 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: source-editor-mutation
          E2E_MUTATION_FLOW: "1"
        run: >-
          pnpm --filter web exec playwright test --config=playwright.config.ts
          e2e/release-mutation-lifecycle.spec.ts
          e2e/ux-whole-site.spec.ts
          e2e/ux-recovery-followup.spec.ts
          e2e/recovery-consistency.spec.ts
          e2e/manual-markdown-fidelity.spec.ts

      - name: Source Editor content cleanup browser gate
        if: ${{ inputs.shard == 3 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: source-editor-cleanup
          E2E_CONTENT_CLEANUP: "1"
          E2E_THINKING_SUMMARY: "1"
        run: >-
          pnpm --filter web exec playwright test --config=playwright.config.ts
          e2e/content-cleanup.spec.ts
          e2e/thinking-summary.spec.ts

      - name: Release I upload-token atomicity matrix
        if: ${{ inputs.shard == 2 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: upload-token-atomicity
          E2E_ATTACHMENT_UPLOAD: "1"
        run: >-
          pnpm --filter web exec playwright test --config=playwright.config.ts
          e2e/source-editor-upload-atomicity.spec.ts
          e2e/attachment-upload-flow.spec.ts

      - name: Release H Markdown and image Viewer checks
        if: ${{ inputs.shard == 2 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: markdown-image-viewer
          E2E_RICH_MARKDOWN_ATTACHMENT: "1"
          E2E_MESSAGE_MARKDOWN_COPY: "1"
        run: >-
          pnpm --filter web exec playwright test --config=playwright.config.ts
          e2e/ai-rich-markdown-attachment.spec.ts
          e2e/attachment-reading.spec.ts
          e2e/message-markdown-copy.spec.ts

      - name: Reading geometry, image snapshots and cross-module recovery
        if: ${{ inputs.shard == 1 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: reading-stability
          E2E_READING_STABILITY: "1"
        run: |
          pnpm --filter web exec playwright test --config=playwright.config.ts e2e/reading-stability.spec.ts e2e/image-natural-flow.spec.ts
          node scripts/ci/verify-reading-stability.mjs

      - name: PDF.js maintained-line browser checks
        if: ${{ inputs.shard == 3 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: pdfjs-maintained-line
          E2E_PDFJS_MIGRATION: "1"
          E2E_SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
        run: >-
          pnpm --filter web exec playwright test --config=playwright.config.ts
          e2e/pdfjs-migration.spec.ts
          e2e/pdfjs-share.spec.ts

      - name: Default PWA baseline
        if: ${{ inputs.shard == 3 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: default-pwa
          E2E_SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
        run: pnpm --filter web exec playwright test --config=playwright.config.ts

      - name: Single-owner authentication browser gate
        if: ${{ inputs.shard == 3 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: single-owner-auth
          AUTH_ENABLED: "true"
          AUTH_SESSION_SECRET: ci-only-auth-session-secret-012345678901234567890
          AUTH_COOKIE_SECURE: "false"
          AUTH_ACTIVITY_TOUCH_INTERVAL_SECONDS: "600"
          AUTH_INACTIVITY_TIMEOUT_SECONDS: "172800"
          E2E_AUTH_EMAIL: auth-ci@example.test
        run: |
          export E2E_AUTH_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24) + "-owner")')"
          cd apps/api
          python - <<'PY'
          import os
          from app.core.config import get_settings
          from app.core.database import SessionLocal
          from app.services.auth import provision_owner
          with SessionLocal() as db:
              principal = provision_owner(db, os.environ["E2E_AUTH_PASSWORD"], get_settings())
              principal.user.normalized_email = os.environ["E2E_AUTH_EMAIL"]
              db.commit()
          PY
          kill "$(cat "$RUNNER_TEMP/api.pid")" || true
          nohup env AUTH_ENABLED=true AUTH_SESSION_SECRET="$AUTH_SESSION_SECRET" AUTH_COOKIE_SECURE=false \
            uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > "$RUNNER_TEMP/auth-api.log" 2>&1 &
          auth_api_pid=$!
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then break; fi
            sleep 1
          done
          cd ../..
          E2E_AUTH=1 E2E_AUTH_PASSWORD="$E2E_AUTH_PASSWORD" \
            pnpm --filter web exec playwright test --config=playwright.config.ts e2e/auth-gate.spec.ts e2e/auth-recovery.spec.ts
          kill "$auth_api_pid" || true
          cd apps/api
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > "$RUNNER_TEMP/api.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then break; fi
            sleep 1
          done

      # Keep the original fourteen gate commands intact. These device cases
      # need AUTH_ENABLED and would otherwise be skipped by the default PWA run.
      - name: Browser extension pairing and authorization recovery
        if: ${{ inputs.shard == 3 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          AUTH_ENABLED: "true"
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/extension-consent.json
        run: |
          pnpm --filter web exec playwright test --config=playwright.config.ts e2e/extension-consent.spec.ts
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "extension-consent.json").read_text())
          stats = report["stats"]
          assert stats["expected"] == 6
          assert stats["unexpected"] == stats["flaky"] == stats["skipped"] == 0
          assert not report["errors"]
          PY

      - name: Release E production-build PWA negative matrix
        if: ${{ inputs.shard == 1 }}
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
          PLAYWRIGHT_GATE_ID: pwa-negative
          E2E_PWA_NEGATIVE: "1"
          NEXT_PUBLIC_PWA_NEGATIVE_TESTS: "1"
          NEXT_DIST_DIR: ".next-pwa-negative"
          RELEASE_E_PROFILE_ROOT: ${{ runner.temp }}/release-e-profiles
        run: |
          /usr/bin/time -f 'build=pwa-negative
          elapsed_seconds=%e
          max_rss_kb=%M' \
            -o "$RUNNER_TEMP/web-build-pwa-negative.txt" \
            pnpm --filter web build
          pnpm --filter web exec playwright test --config=playwright.config.ts e2e/pwa-negative.spec.ts

      - name: Build machine-readable browser gate summary
        if: always()
        env:
          PLAYWRIGHT_EXPECTED_GATES: ${{ inputs.shard == 1 && 'adaptive-import-recovery,csp-enforcement,reading-stability,pwa-negative' || inputs.shard == 2 && 'share-focus,source-editor-mutation,upload-token-atomicity,markdown-image-viewer' || 'context-files,focused-online-security,source-editor-cleanup,pdfjs-maintained-line,default-pwa,single-owner-auth' }}
        run: >-
          node apps/web/e2e/gate-summary.mjs
          apps/web/test-results
          apps/web/test-results/web-shard-gate-summary.json

      - name: Upload non-deployable quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-quality-shard-${{ inputs.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dependency-audit.json
            ${{ runner.temp }}/dependency-audit-report.json
            ${{ runner.temp }}/dependency-audit-source.txt
            ${{ runner.temp }}/web-build-standard.txt
            ${{ runner.temp }}/web-build-pwa-negative.txt
            ${{ runner.temp }}/pnpm-cache.txt
            ${{ runner.temp }}/optimization-resource-measurement.json
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/worker.log
            ${{ runner.temp }}/attachment-modal-final/result.json
            ${{ runner.temp }}/attachment-modal-final/*.png
            ${{ runner.temp }}/image-scale-slider-browser/result.json
            ${{ runner.temp }}/image-scale-slider-browser/failure.json
            ${{ runner.temp }}/image-scale-slider-browser/*.png
            ${{ runner.temp }}/reader-interaction-browser/result.json
            ${{ runner.temp }}/reader-interaction-browser/failure-state.json
            ${{ runner.temp }}/reader-interaction-browser/*.png
            ${{ runner.temp }}/reading-position-browser/result.json
            ${{ runner.temp }}/reading-position-browser/*.png
            ${{ runner.temp }}/import-recovery-browser/result.json
            ${{ runner.temp }}/import-recovery-browser/failure.json
            ${{ runner.temp }}/import-recovery-browser/*.png
            ${{ runner.temp }}/admin-runtime-browser/result.json
            ${{ runner.temp }}/admin-runtime-browser/*.png
            ${{ runner.temp }}/import-source-repair-browser/result.json
            ${{ runner.temp }}/import-source-repair-browser/failure.json
            ${{ runner.temp }}/import-source-repair-browser/*.png
            ${{ runner.temp }}/reader-table-actions-browser/result.json
            ${{ runner.temp }}/reader-table-actions-browser/failure.json
            ${{ runner.temp }}/reader-table-actions-browser/*.png
            ${{ runner.temp }}/offline-recovery-browser/result.json
            ${{ runner.temp }}/offline-recovery-browser/failure.json
            ${{ runner.temp }}/offline-recovery-browser/*.png
            ${{ runner.temp }}/attachment-recovery-browser/result.json
            ${{ runner.temp }}/attachment-recovery-browser/failure.json
            ${{ runner.temp }}/attachment-recovery-browser/*.png
            ${{ runner.temp }}/table-browser/result.json
            ${{ runner.temp }}/table-browser/*.png
            ${{ runner.temp }}/export-recovery-browser/result.json
            ${{ runner.temp }}/export-recovery-browser/failure.json
            ${{ runner.temp }}/export-recovery-browser/*.png
            ${{ runner.temp }}/reading-feedback-browser/result.json
            ${{ runner.temp }}/reading-feedback-browser/failure.json
            ${{ runner.temp }}/reading-feedback-browser/*.png
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve merge attachment result evidence
        if: ${{ always() && inputs.shard == 3 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: merge-attachment-result-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/merge-attachment-result-browser/result.json
            ${{ runner.temp }}/merge-attachment-result-browser/failure.json
            ${{ runner.temp }}/merge-attachment-result-browser/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Preserve device authorization native results
        if: ${{ always() && inputs.shard == 3 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extension-consent-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/extension-consent.json
          if-no-files-found: error
          retention-days: 14

      - name: Preserve navigation and import component evidence
        if: ${{ always() && inputs.shard == 1 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: navigation-import-components-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/import-batch-browser/result.json
            ${{ runner.temp }}/import-batch-browser/failure.json
            ${{ runner.temp }}/import-batch-browser/*.png
            ${{ runner.temp }}/navigation-import-layout-browser/result.json
            ${{ runner.temp }}/navigation-import-layout-browser/failure.json
            ${{ runner.temp }}/navigation-import-layout-browser/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Stop owned disposable PostgreSQL
        if: ${{ always() && steps.postgres.outcome == 'success' }}
        run: bash scripts/ci/postgres-service.sh stop
