name: API full collection shard
on:
  workflow_call:
    inputs:
      shard:
        required: true
        type: number
permissions:
  contents: read

env:
  APP_ENV: test
  DATABASE_URL: postgresql+psycopg://chat_reader:chat_reader_ci@127.0.0.1:5432/chat_reader
  ATTACHMENT_CURSOR_SECRET: synthetic-ci-attachment-cursor-secret-at-least-32-characters
  API_INTERNAL_URL: http://127.0.0.1:8000
  PUBLIC_WEB_BASE_URL: http://127.0.0.1:3107
  CORS_ORIGINS: http://127.0.0.1:3107
  IMPORT_STORAGE_DIR: /tmp/chat-reader/imports
  EXPORT_STORAGE_DIR: /tmp/chat-reader/exports
  OFFLINE_STORAGE_DIR: /tmp/chat-reader/offline
  ASSET_STORAGE_DIR: /tmp/chat-reader/assets
  POSTGRES_EXPORT_INTEGRATION: "1"

jobs:
  suite:
    runs-on: ubuntu-latest
    env:
      # The exact browser scan helper is also exercised by disposable PG tests.
      # Keep its guarded port instead of weakening the seeder's admission check.
      DATABASE_URL: postgresql+psycopg://chat_reader:chat_reader_ci@127.0.0.1:65438/chat_reader
      CI_POSTGRES_PORT: "65438"
      CI_QUALITY_SHARD: ${{ inputs.shard }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start pinned disposable PostgreSQL with official-source fallback
        id: postgres
        run: bash scripts/ci/postgres-service.sh start
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-test.lock
      - name: Install API dependencies
        run: |
          python -m pip install --require-hashes -r apps/api/requirements-test.lock -r apps/api/requirements-build.lock
          python -m pip install --no-deps --no-build-isolation -e "apps/api[test]"
      - name: Prepare API test services
        run: |
          mkdir -p "$IMPORT_STORAGE_DIR" "$EXPORT_STORAGE_DIR" "$OFFLINE_STORAGE_DIR" "$ASSET_STORAGE_DIR"
          cd apps/api
          python -m alembic upgrade head
      - name: Context runtime and distributed Bundle consistency
        run: |
          python tools/context-skills/build.py --output apps/web/public/skills --check
          python -m pytest tools/context-skills/tests -q
      # The full suite owns these same offline/cleanup tests. Keep capture=tee
      # for characterization output instead of running the tests twice.
      - name: API full suite
        env:
          SETTINGS_POSTGRES_INTEGRATION: "1"
          AUTH_SESSION_SECRET: synthetic-settings-postgres-ci-secret-0123456789
        run: |
          cd apps/api
          PYTHONPATH="$GITHUB_WORKSPACE/scripts/ci${PYTHONPATH:+:$PYTHONPATH}" \
            pytest -vv --capture=tee-sys -o faulthandler_timeout=120 -p api_shard_plugin \
            --ci-shard="$CI_QUALITY_SHARD" --ci-evidence="$RUNNER_TEMP/api-execution.json" \
            --junitxml="$RUNNER_TEMP/api-junit.xml"
      - name: Alembic single-head and current validation
        run: |
          cd apps/api
          python scripts/verify_migration_state.py --require-current
      - name: Preserve actual API execution and native JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-quality-shard-${{ inputs.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/api-execution.json
            ${{ runner.temp }}/api-junit.xml
          if-no-files-found: error
          retention-days: 14
      - name: Stop owned disposable PostgreSQL
        if: ${{ always() && steps.postgres.outcome == 'success' }}
        run: bash scripts/ci/postgres-service.sh stop
