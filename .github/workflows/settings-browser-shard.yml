name: Settings browser shard

on:
  workflow_call:
    inputs:
      shard:
        required: true
        type: number

permissions:
  contents: read

# Caller workflow env does not propagate through workflow_call.
# These are the same synthetic fixture inputs as the exact full release.
env:
  APP_ENV: test
  DATABASE_URL: postgresql+psycopg://chat_reader:chat_reader_ci@127.0.0.1:5432/chat_reader
  ATTACHMENT_CURSOR_SECRET: synthetic-ci-attachment-cursor-secret-at-least-32-characters
  API_INTERNAL_URL: http://127.0.0.1:8000
  PUBLIC_WEB_BASE_URL: http://127.0.0.1:3107
  CORS_ORIGINS: http://127.0.0.1:3107
  IMPORT_STORAGE_DIR: /tmp/chat-reader/imports
  EXPORT_STORAGE_DIR: /tmp/chat-reader/exports
  OFFLINE_STORAGE_DIR: /tmp/chat-reader/offline
  ASSET_STORAGE_DIR: /tmp/chat-reader/assets
  POSTGRES_EXPORT_INTEGRATION: "1"

jobs:
  matrix:
    runs-on: ubuntu-latest
    # No custom CI job/step timeouts; the hosted runner's platform cap applies.
    # Serial tests, native case deadlines and worker/resource bounds stay.
    env:
      DATABASE_URL: postgresql+psycopg://chat_reader:chat_reader_ci@127.0.0.1:65438/chat_reader
      # Keep the disposable fixture on a port allowed by the guarded seeders.
      CI_POSTGRES_PORT: "65438"
      AUTH_ENABLED: "true"
      AUTH_SESSION_SECRET: synthetic-settings-ci-session-secret-0123456789
      AUTH_COOKIE_SECURE: "false"
      E2E_SETTINGS_MAILBOX: "1"
      IMPORT_COMMIT_INLINE: "true"
      E2E_AUTH_EMAIL: settings-ci@example.test
      E2E_AUTH_PASSWORD: synthetic-settings-ci-admin-passphrase
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "8320"
      SMTP_STARTTLS: "false"
      SMTP_FROM_ADDRESS: noreply@example.test
      PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
      PLAYWRIGHT_GATE_ID: ${{ format('settings-stages-1-4-shard-{0}', inputs.shard) }}
      CI_QUALITY_SHARD: ${{ inputs.shard }}
      NEXT_PUBLIC_PWA_NEGATIVE_TESTS: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate fixed independent shard
        shell: bash
        run: |
          case "$CI_QUALITY_SHARD" in 1|2|3|4) ;; *) exit 1 ;; esac

      - name: Record Settings completion timing mode
        shell: bash
        run: |
          printf 'mode=%s\njob_timeout_minutes=%s\nsource_sha=%s\nworkflow_run_id=%s\nworkflow_run_attempt=%s\nstarted_at=%s\n' \
            'platform-default' \
            'not-set' \
            '${{ github.sha }}' \
            '${{ github.run_id }}' \
            '${{ github.run_attempt }}' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            | tee "$RUNNER_TEMP/settings-completion-mode.txt"

      - name: Start pinned disposable PostgreSQL with official-source fallback
        id: postgres
        run: bash scripts/ci/postgres-service.sh start

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.1"
          cache: pnpm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-test.lock

      - name: Install and migrate disposable fixture
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          python -m pip install --require-hashes -r apps/api/requirements-test.lock -r apps/api/requirements-build.lock
          python -m pip install --no-deps --no-build-isolation -e "apps/api[test]"
          mkdir -p "$IMPORT_STORAGE_DIR" "$EXPORT_STORAGE_DIR" "$OFFLINE_STORAGE_DIR" "$ASSET_STORAGE_DIR"
          cd apps/api
          python -m alembic upgrade head

      - name: Build authenticated Web and install Chromium
        run: |
          /usr/bin/time -f 'phase=authenticated-web-build\nelapsed_seconds=%e\nmax_rss_kb=%M\nexit_code=%x' \
            -o "$RUNNER_TEMP/settings-build-timing.txt" pnpm --filter web build
          pnpm --filter web exec playwright install --with-deps chromium

      - name: Real settings, SMTP, offline and sync browser matrix
        env:
          E2E_CONTEXT_ADMIN: "1"
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ runner.temp }}/settings-blob-report
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/settings-shard-report.json
          PLAYWRIGHT_BLOB_OUTPUT_NAME: settings-${{ inputs.shard }}.zip
        run: |
          cd apps/api
          uvicorn settings_browser_fixture:app --app-dir tests --host 127.0.0.1 --port 8000 --no-access-log > "$RUNNER_TEMP/settings-api.log" 2>&1 &
          settings_api_pid=$!
          python -m app.workers.import_worker > "$RUNNER_TEMP/settings-worker.log" 2>&1 &
          settings_worker_pid=$!
          printf 'phase=settings-matrix\nfixture_start_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$RUNNER_TEMP/settings-fixture-lifecycle.txt"
          trap 'status=$?; printf "fixture_stop_at=%s\nstep_exit_code=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$status" >> "$RUNNER_TEMP/settings-fixture-lifecycle.txt" || true; kill "$settings_api_pid" "$settings_worker_pid" 2>/dev/null || true; exit "$status"' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          cd ../..
          /usr/bin/time -f 'phase=settings-matrix\nelapsed_seconds=%e\nmax_rss_kb=%M\nexit_code=%x' \
            -o "$RUNNER_TEMP/settings-matrix-timing.txt" \
            node scripts/ci/run-settings-shard.mjs
          PLAYWRIGHT_EXPECTED_GATES="$PLAYWRIGHT_GATE_ID" node apps/web/e2e/gate-summary.mjs apps/web/test-results apps/web/test-results/settings-shard-gate-summary.json

      - name: Upload settings quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: settings-quality-shard-${{ inputs.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/web/test-results
            ${{ runner.temp }}/settings-blob-report
            ${{ runner.temp }}/settings-shard-report.json
            ${{ runner.temp }}/settings-shard-collection.json
            ${{ runner.temp }}/settings-selection.json
            ${{ runner.temp }}/settings-completion-mode.txt
            ${{ runner.temp }}/settings-build-timing.txt
            ${{ runner.temp }}/settings-matrix-timing.txt
            ${{ runner.temp }}/settings-restore-timing.txt
            ${{ runner.temp }}/settings-fixture-lifecycle.txt
            ${{ runner.temp }}/archive-fixture-lifecycle.txt
            ${{ runner.temp }}/settings-api.log
            ${{ runner.temp }}/settings-worker.log
            ${{ runner.temp }}/archive-api.log
            ${{ runner.temp }}/archive-worker.log
          retention-days: 14

      - name: Stop owned disposable PostgreSQL
        if: ${{ always() && steps.postgres.outcome == 'success' }}
        run: bash scripts/ci/postgres-service.sh stop
