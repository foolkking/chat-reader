name: chat-reader

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chat_reader}
      POSTGRES_USER: ${POSTGRES_USER:-chat_reader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging: *default-logging
    networks:
      - backend

  migrate:
    image: ${API_IMAGE:-chat-reader-api:latest}
    build:
      context: ./apps/api
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: &api-environment
      APP_NAME: ${APP_NAME:-chat-reader}
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-chat_reader}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chat_reader}
      CORS_ORIGINS: ${PUBLIC_WEB_BASE_URL:?PUBLIC_WEB_BASE_URL must be set}
      PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_BASE_URL}
      MAX_IMPORT_FILE_SIZE_MB: ${MAX_IMPORT_FILE_SIZE_MB:-50}
      IMPORT_STALE_AFTER_SECONDS: ${IMPORT_STALE_AFTER_SECONDS:-300}
      WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-30}
      WORKER_HEARTBEAT_STALE_AFTER_SECONDS: ${WORKER_HEARTBEAT_STALE_AFTER_SECONDS:-120}
      ENABLE_INTERNAL_DIAGNOSTICS: ${ENABLE_INTERNAL_DIAGNOSTICS:-false}
      ARTIFACT_CLEANUP_GRACE_HOURS: ${ARTIFACT_CLEANUP_GRACE_HOURS:-24}
      IMPORT_STORAGE_DIR: /data/imports
      EXPORT_STORAGE_DIR: /data/exports
      OFFLINE_STORAGE_DIR: /data/offline
      ASSET_STORAGE_DIR: /data/assets
      ASSET_STORAGE_BACKEND: ${ASSET_STORAGE_BACKEND:-local}
      ASSET_S3_BUCKET: ${ASSET_S3_BUCKET:-}
      ASSET_S3_ENDPOINT_URL: ${ASSET_S3_ENDPOINT_URL:-}
      ASSET_S3_REGION: ${ASSET_S3_REGION:-}
      ASSET_S3_PREFIX: ${ASSET_S3_PREFIX:-attachments}
      ATTACHMENT_SCANNER: ${ATTACHMENT_SCANNER:-disabled}
      ALLOW_UNSCANNED_ATTACHMENTS: ${ALLOW_UNSCANNED_ATTACHMENTS:-true}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-30}
      REMOTE_SCANNER_URL: ${REMOTE_SCANNER_URL:-}
      REMOTE_SCANNER_TOKEN: ${REMOTE_SCANNER_TOKEN:-}
      REMOTE_SCANNER_TIMEOUT_SECONDS: ${REMOTE_SCANNER_TIMEOUT_SECONDS:-60}
      ASSET_SCAN_REQUIRED: ${ASSET_SCAN_REQUIRED:-false}
      ATTACHMENT_UPLOAD_ENABLED: ${ATTACHMENT_UPLOAD_ENABLED:-true}
      ATTACHMENT_UPLOAD_TTL_HOURS: ${ATTACHMENT_UPLOAD_TTL_HOURS:-24}
      ATTACHMENT_CURSOR_SECRET: ${ATTACHMENT_CURSOR_SECRET:?ATTACHMENT_CURSOR_SECRET must be set}
      BUNDLE_MAX_COMPRESSED_BYTES: ${BUNDLE_MAX_COMPRESSED_BYTES:-536870912}
      BUNDLE_MAX_EXPANDED_BYTES: ${BUNDLE_MAX_EXPANDED_BYTES:-2147483648}
      BUNDLE_MAX_OBJECT_BYTES: ${BUNDLE_MAX_OBJECT_BYTES:-268435456}
      BUNDLE_MAX_ENTRIES: ${BUNDLE_MAX_ENTRIES:-5000}
      BUNDLE_MAX_OBJECTS: ${BUNDLE_MAX_OBJECTS:-2000}
      BUNDLE_MAX_COMPRESSION_RATIO: ${BUNDLE_MAX_COMPRESSION_RATIO:-100}
      BUNDLE_MAX_PATH_DEPTH: ${BUNDLE_MAX_PATH_DEPTH:-4}
      COMPLEX_ATTACHMENT_PREVIEW_ENABLED: ${COMPLEX_ATTACHMENT_PREVIEW_ENABLED:-false}
      ATTACHMENT_PREVIEW_ORIGIN: ${ATTACHMENT_PREVIEW_ORIGIN:-}
      WEB_CONCURRENCY: ${API_WORKERS:-1}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    logging: *default-logging

  api:
    image: ${API_IMAGE:-chat-reader-api:latest}
    build:
      context: ./apps/api
    restart: unless-stopped
    environment: *api-environment
    volumes:
      - import-storage:/data/imports
      - export-storage:/data/exports
      - offline-storage:/data/offline
      - asset-storage:/data/assets
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)",
        ]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
    logging: *default-logging

  import-worker:
    image: ${API_IMAGE:-chat-reader-api:latest}
    build:
      context: ./apps/api
    restart: unless-stopped
    command: ["python", "-m", "app.workers.import_worker"]
    mem_limit: ${IMPORT_WORKER_MEMORY_LIMIT:-640m}
    environment: *api-environment
    volumes:
      - import-storage:/data/imports
      - export-storage:/data/exports
      - offline-storage:/data/offline
      - asset-storage:/data/assets
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
    logging: *default-logging

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    profiles: ["scanner"]
    expose:
      - "3310"
    volumes:
      - clamav-data:/var/lib/clamav
    networks:
      - backend
    logging: *default-logging

  web:
    image: ${WEB_IMAGE:-chat-reader-web:latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
        COMPLEX_ATTACHMENT_PREVIEW_ENABLED: ${COMPLEX_ATTACHMENT_PREVIEW_ENABLED:-false}
        ATTACHMENT_PREVIEW_ORIGIN: ${ATTACHMENT_PREVIEW_ORIGIN:-}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
    logging: *default-logging

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  import-storage:
  export-storage:
  offline-storage:
  asset-storage:
  clamav-data:
