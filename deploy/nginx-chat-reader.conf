server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;

    # Per-route upload limits include multipart overhead; keep unrelated APIs small.
    client_max_body_size 60m;

    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /offline {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    include /etc/nginx/snippets/chat-reader-internal-diagnostics.conf;

    location = /api/imports/preview {
        client_max_body_size 520m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ^~ /api/attachment-upload-sessions/ {
        client_max_body_size 1040m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /api/adaptive-import/sessions {
        # A batch may contain several files; the API enforces 500 MiB per file
        # and a separate 512 MiB aggregate limit.
        client_max_body_size 520m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
