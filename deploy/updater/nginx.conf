# Include inside the canonical TLS server, before application locations.
# The server-level fence also covers the special upload and public-image locations.
set $cr_update_fence "";
if (-f /var/lib/chat-reader-update-progress/maintenance) { set $cr_update_fence 1; }
if ($uri ~ "^/(__updates/(status)?|api/health)$") { set $cr_update_fence ""; }
if ($cr_update_fence) { return 503; }
location ^~ /__updates/ {
    limit_except GET { deny all; }
    access_log off;
    error_log /dev/null;
    proxy_cache off;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "cr_update_monitor=$cookie_cr_update_monitor";
    proxy_pass http://unix:/run/chat-reader-update-status/status.sock:;
}
